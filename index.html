:root{
  --paper:#F0F5E8; --surface:#FFFFFF; --soft:#F6F9F0;
  --ink:#14261B; --ink2:#3A4C40; --muted:#5C6C61; --faint:#97A49A;
  --line:#DDE5D3; --line2:#C2CDB9;
  --turf:#1E7A46; --turf-d:#145A32; --turf-dd:#0E3E24; --turf-tint:#E2F1E0; --turf-line:#B3D7B6;
  --pear:#C9E052; --pear-d:#7F9A12;
  --gold:#FFCB3D; --gold-soft:#FFF5D2; --gold-ink:#553B00; --gold-d:#DFA000;
  --silver:#D3DBE0; --silver-soft:#EEF2F4; --silver-ink:#2D3840; --silver-d:#9AA8B1;
  --bronze:#F0AE7C; --bronze-soft:#FCEADC; --bronze-ink:#5C2D0A; --bronze-d:#C97B43;
  --rose:#E2365F; --red:#B3261E; --red-bg:#FCEBE9; --amber:#7A4A00;
  --r:14px; --rs:10px;
  --font:"Bricolage",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit}
.ico{width:16px;height:16px;flex:0 0 auto;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num,.pts,.zero,.big,.gamt,.gtot,.cell-p,td,.bdiv,.ptot{font-variant-numeric:tabular-nums}

/* ---------- Top band: mown turf ---------- */
.top{position:sticky;top:0;z-index:20;color:#fff;background-color:var(--turf);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 64px,rgba(255,255,255,0) 64px 128px);
  border-bottom:4px solid var(--pear)}
.topin{display:flex;align-items:center;gap:26px;max-width:1200px;margin:0 auto;padding:0 24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap;min-width:0}
.brand svg{flex:0 0 auto;width:62px;height:auto;margin:-2px 0 0}
.brand span{overflow:hidden;text-overflow:ellipsis}
nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
nav button{background:none;border:0;border-radius:999px;padding:8px 15px;font-size:15.5px;font-weight:600;color:rgba(255,255,255,.88);cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.14);color:#fff}
nav button.on,nav button.on:hover{background:#fff;color:var(--turf-d);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:14.5px;color:rgba(255,255,255,.85);white-space:nowrap}
.who b{color:#fff;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--pear);color:var(--turf-dd)}
main{max-width:1200px;margin:0 auto;padding:22px 24px 110px}

/* ---------- Small controls ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--turf)}
.chip.on{background:var(--turf);border-color:var(--turf);color:#fff}
.chip .ico{width:13px;height:13px;margin-left:4px}
.seg{display:inline-flex;margin-bottom:14px;padding:4px;background:#DCE6D0;border-radius:999px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--turf-d);font-weight:700;box-shadow:0 1px 2px rgba(20,38,27,.15)}

/* ---------- Cards & text ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 0 rgba(20,38,27,.04)}
.card h3{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;display:flex;align-items:center;gap:10px}
.rno{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:26px;padding:0 7px;border-radius:999px;
  background:var(--turf-tint);color:var(--turf-d);font-weight:800;font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:14.5px}
.meta{margin:2px 0 0 48px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:28px 0 10px}
.note{margin:0 2px 10px}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill .ico{width:12px;height:12px}
.pill.open{background:var(--pear);color:var(--turf-dd)}
.pill.closed{background:#E3E9DB;color:var(--ink2)}
.pill.result{background:var(--gold);color:var(--gold-ink)}

/* ---------- Inputs ---------- */
select,input,textarea{font:inherit;font-size:15px;border:1.5px solid var(--line2);border-radius:var(--rs);padding:8px 11px;background:var(--surface);color:var(--ink);max-width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--turf);box-shadow:0 0 0 3px var(--turf-tint)}
input[type=checkbox]{accent-color:var(--turf)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
label.f{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 5px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#E3E9DB;padding:1px 5px;border-radius:5px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--turf);color:#fff;border:0;border-radius:999px;
  padding:9px 18px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 var(--turf-dd)}
.btn:hover{background:var(--turf-d)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--turf-dd)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2),0 2px 0 var(--line2)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:5px 12px;font-size:13.5px}
.btn.danger{background:var(--surface);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--line2),0 2px 0 var(--line2)}
.btn.danger:hover{background:var(--red-bg)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.dayb:focus-visible,.rb:focus-visible,.rr:focus-visible,.mr:focus-visible,.todo:focus-visible{outline:3px solid var(--turf);outline-offset:2px}
nav button:focus-visible{outline:3px solid var(--pear);outline-offset:1px}
.lnk{color:var(--turf);background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- Save bar ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,38,27,.07)}
.savebar .in{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;padding:12px 24px;font-size:15.5px}
.savebar b{font-weight:800}
.sv{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.sv.ok{color:var(--turf)}
.sv.bad{color:var(--red)}

/* ---------- Tips & results ---------- */
.yourtip{margin-top:12px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);border-radius:var(--rs);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15.5px}
.pts{font-weight:800;color:var(--turf)}
.zero{color:var(--faint);font-weight:500}
.warn{margin-top:10px;color:var(--red);font-weight:700;font-size:14.5px}
.scr{text-decoration:line-through;color:var(--muted)}

/* place medals: used wherever a horse ran 1st, 2nd or 3rd */
.medal{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:44px;height:30px;padding:0 10px;border-radius:999px;
  font-size:15px;font-weight:800;letter-spacing:-.01em;background:var(--silver);color:var(--silver-ink);box-shadow:inset 0 -2px 0 var(--silver-d)}
.medal.p1{background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 -2px 0 var(--gold-d)}
.medal.p3{background:var(--bronze);color:var(--bronze-ink);box-shadow:inset 0 -2px 0 var(--bronze-d)}

/* ---------- The judge's board: placegetters in big numbers ---------- */
.board{background:var(--turf-dd);color:#fff;border-radius:var(--r);padding:14px 16px 16px;margin-bottom:12px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 64px,rgba(255,255,255,0) 64px 128px)}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px;font-weight:700;color:rgba(255,255,255,.8)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bplace{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;border-top:5px solid var(--silver)}
.bplace.p1{border-top-color:var(--gold)}
.bplace.p3{border-top-color:var(--bronze)}
.bpos{grid-column:1 / -1;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--silver)}
.bplace.p1 .bpos{color:var(--gold)}
.bplace.p3 .bpos{color:var(--bronze)}
.bnum{display:flex;align-items:center;justify-content:center;min-width:68px;height:68px;padding:0 8px;border-radius:10px;background:#fff;color:var(--ink);
  font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.binfo{min-width:0}
.bname{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.bname .silkbox,.bname .silk{flex:0 0 auto}
.bdiv{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:5px;font-size:15.5px;color:rgba(255,255,255,.78)}
.bdiv b{color:#fff;font-weight:800;font-size:17px}

/* ---------- Summary figures ---------- */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{padding:13px 16px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0;box-shadow:0 2px 0 rgba(20,38,27,.04)}
.stat:nth-child(1){background:var(--turf-tint);border-color:var(--turf-line)}
.stat:nth-child(2){background:var(--gold-soft);border-color:#F2DF9E}
.stat .lbl{font-size:14px;color:var(--ink2);font-weight:600}
.stat .big{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.stat .sub{font-size:14px;color:var(--ink2)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:0 2px 0 rgba(20,38,27,.04)}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{background:var(--soft);font-size:13.5px;font-weight:700;color:var(--muted)}
th.sort{cursor:pointer}
th.sort:hover,th.sort.cur{color:var(--ink)}
td.num,th.num{text-align:right}
th.dcol{white-space:normal;min-width:86px;max-width:130px;line-height:1.3;vertical-align:bottom}
td b{font-weight:800}
td.pact{text-align:right}
td.pact .btn{margin:2px 0 2px 4px}
tr.me td{background:var(--turf-tint)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.click.me:hover td{background:#D6EBD4}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;font-size:14.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.r1{background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 -2px 0 var(--gold-d)}
.r2{background:var(--silver);color:var(--silver-ink);box-shadow:inset 0 -2px 0 var(--silver-d)}
.r3{background:var(--bronze);color:var(--bronze-ink);box-shadow:inset 0 -2px 0 var(--bronze-d)}
td.daywin span{display:inline-block;margin:-3px -9px;padding:3px 9px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:800}
.cell-p{font-size:13.5px;margin-top:1px}

/* ---------- Ladder podium ---------- */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:640px;margin:6px auto 18px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.pname{max-width:100%;font-size:17px;font-weight:800;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptot{font-size:16px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.pstep{width:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;border-radius:12px 12px 0 0;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pod.p1 .pstep{height:108px;background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 -4px 0 var(--gold-d)}
.pod.p2 .pstep{height:80px;background:var(--silver);color:var(--silver-ink);box-shadow:inset 0 -4px 0 var(--silver-d)}
.pod.p3 .pstep{height:60px;background:var(--bronze);color:var(--bronze-ink);box-shadow:inset 0 -4px 0 var(--bronze-d)}
.pod.me .pname{color:var(--turf)}

/* ---------- Admin ---------- */
.agrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
@media (max-width:999px){.agrid{display:block}}
.acol>h2:first-child{margin-top:4px}
.acol .days{grid-template-columns:repeat(3,1fr)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:14.5px;font-weight:600;cursor:pointer}
.plc{display:grid;grid-template-columns:66px 1fr 88px 88px;gap:8px;align-items:center;margin-bottom:6px}
.plc input,.plc select{width:100%}
.plc.muted{font-size:13px;margin-bottom:4px}
.autost{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-weight:700;font-size:14.5px;padding:9px 14px;border-radius:var(--rs)}
.autost i{width:9px;height:9px;border-radius:50%;background:currentColor}
.autost.on{background:var(--turf-tint);color:var(--turf-d)}
.autost.off{background:var(--gold-soft);color:var(--amber)}
.oldwarn{max-width:1152px;margin:16px auto 0;background:var(--red-bg);color:#7A1A14;border:1px solid #F1C6C2;border-radius:var(--rs);padding:12px 14px;font-size:14.5px;line-height:1.5}
main .oldwarn{margin:0 0 12px}

/* ---------- Toast / modal / empty ---------- */
#toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:15px;font-weight:700;opacity:0;transition:all .2s;pointer-events:none;z-index:40;max-width:90%;box-shadow:0 6px 20px rgba(20,38,27,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(14,62,36,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:640px;width:100%;margin:0;box-shadow:0 20px 50px rgba(20,38,27,.3)}
.empty{text-align:center;padding:44px 16px;color:var(--muted);background:var(--surface);border:2px dashed var(--line2);border-radius:var(--r);font-size:16px;font-weight:600}
.loading{text-align:center;padding:80px 10px;color:var(--muted);font-size:17px;font-weight:700}

/* ---------- Race day picker: all days visible ---------- */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media (min-width:760px){.days{grid-template-columns:repeat(6,1fr)}}
.dayb{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;padding:10px 13px 11px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 0 rgba(20,38,27,.05)}
.dayb:hover{border-color:var(--turf)}
.dayb .dn{font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.015em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dayb .dm{display:flex;flex-wrap:wrap;align-items:center;gap:1px 10px;font-size:13.5px;color:var(--muted);margin-top:auto}
.ds{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink2)}
.ds i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.ds.live{color:var(--rose)}.ds.live i{background:var(--rose);animation:pulse 1.4s ease-out infinite}
.ds.soon{color:var(--turf)}.ds.soon i{background:var(--pear-d)}
.ds.locked{color:var(--amber)}.ds.locked i{background:var(--gold-d)}
.ds.up{color:var(--muted);font-weight:500}.ds.up i{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.dayb.on{background:var(--turf);border-color:var(--turf);color:#fff;box-shadow:0 3px 0 var(--turf-dd)}
.dayb.on .dm,.dayb.on .ds{color:rgba(255,255,255,.88)}
.dayb.on .ds i{background:var(--pear);box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,54,95,.55)}100%{box-shadow:0 0 0 7px rgba(226,54,95,0)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- Tip lock notice ---------- */
.lockban{display:flex;gap:10px;align-items:flex-start;padding:11px 15px;margin-bottom:12px;font-size:15px;line-height:1.45;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.lockban b{color:var(--ink);font-weight:800;margin-right:7px}
.lockban .ico{margin-top:3px;width:17px;height:17px}
.lockban.open{background:var(--turf-tint);border-color:var(--turf-line)}
.lockban.open .ico{color:var(--turf)}

/* ---------- Races: one race at a time ---------- */
.rbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;scroll-margin-top:80px}
@media (min-width:760px){.rbtns{display:flex}.rb{flex:1 1 0}}
.rb{display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 2px 6px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 0 rgba(20,38,27,.05)}
.rb:hover{border-color:var(--turf)}
.rb b{font-size:16px;font-weight:800}
.rb span{font-size:13.5px;color:var(--muted);min-height:20px}
.rb.has span{color:var(--turf);font-weight:800}
.rb.on{background:var(--turf);border-color:var(--turf);color:#fff;box-shadow:0 3px 0 var(--turf-dd)}
.rb.on span{color:var(--pear)}
.racehead{margin-bottom:12px}
.racehead>.row{flex-wrap:nowrap;align-items:flex-start;gap:12px}
.racehead h3{flex:1;min-width:0;align-items:flex-start}
.racehead .sp{display:none}
.racehead .pill{margin-top:2px}
.pickl{padding:0;overflow:hidden}
.rr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr.tap{cursor:pointer}
.rr.tap:hover{background:var(--soft)}
.rr.sel,.rr.sel.tap:hover{background:var(--turf-tint);box-shadow:inset 5px 0 0 var(--turf)}
.rr.is-scr .rsilk,.rr.is-scr .rnum,.rr.is-scr .rmain,.rr.is-scr .rmid{opacity:.5}
.rr.pl1{background:var(--gold-soft);box-shadow:inset 5px 0 0 var(--gold-d)}
.rr.pl2{background:var(--silver-soft);box-shadow:inset 5px 0 0 var(--silver-d)}
.rr.pl3{background:var(--bronze-soft);box-shadow:inset 5px 0 0 var(--bronze-d)}
.rnum{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);background:var(--surface);font-weight:800;font-size:16px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cloth{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;padding:0 4px;margin-right:8px;border-radius:7px;border:1.5px solid var(--ink);background:var(--surface);
  font-weight:800;font-size:13.5px;color:var(--ink);vertical-align:middle;line-height:1;font-variant-numeric:tabular-nums}
.rsilk{grid-column:1;grid-row:1}
.rnum{grid-column:2;grid-row:1}
.rmain{grid-column:3;grid-row:1;min-width:0}
.pickl.ns .rr{grid-template-columns:0 auto minmax(0,1fr) auto}
.pickl.ns .rnum{margin-left:-12px}
.rname{font-weight:800;font-size:18px;letter-spacing:-.015em;line-height:1.25;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rbar{font-size:14px;font-weight:500;color:var(--muted)}
.rmeta{font-size:14.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rwho{font-size:14px;margin-top:3px;white-space:normal}
.rmid{grid-column:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:6px;min-width:0}
.rmid:empty{display:none}
.rres{display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--ink)}
.form{display:inline-flex;align-items:center;gap:2px}
.flbl{font-size:13.5px;color:var(--muted);margin-right:5px}
.form i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.form .f1{background:var(--gold);color:var(--gold-ink)}
.form .f23{background:var(--silver);color:var(--silver-ink)}
.form .fo{color:var(--ink2)}
.form .fx{color:var(--faint)}
.rright{grid-column:4;grid-row:1 / span 2;min-width:36px;text-align:center}
.rright b{display:block;font-size:20px;font-weight:800;line-height:1.05}
.rright span{font-size:12.5px;color:var(--muted)}
.radio{display:inline-flex !important;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);color:#fff !important}
.radio .ico{width:15px;height:15px;stroke-width:2.4}
.rr.tap:hover .radio{border-color:var(--turf)}
.rr.sel .radio{background:var(--turf);border-color:var(--turf);animation:pop .25s ease-out}
.rnav{display:flex;justify-content:space-between;gap:10px;margin:14px 0 30px}
.rnav .btn{padding:11px 20px}
@media (min-width:860px){
  .rr{grid-template-columns:auto auto minmax(0,1fr) 300px 52px}
  .pickl.ns .rr{grid-template-columns:0 auto minmax(0,1fr) 300px 52px}
  .rmid{grid-column:4;grid-row:1;margin-top:0}
  .rright{grid-column:5;grid-row:1}
}

/* racing colours: a 20x24 slice of the TABtouch image, scaled up */
.rsilk{width:32px;height:40px;display:flex;align-items:center;justify-content:center}
.rsilk .silk{width:32px;height:36px}
.rsilk img.silk{object-fit:contain}
.silkbox{display:inline-block;overflow:hidden;vertical-align:middle;flex:0 0 auto}
.silksp{display:block;overflow:hidden;transform-origin:top left}
.silksp img{display:block;max-width:none;width:auto;height:24px}
.msilk{display:inline-flex;align-items:center;margin-right:8px;vertical-align:middle}
.msilk .silk{width:26px;height:29px;display:block;object-fit:contain}
.bname .silk{width:26px;height:29px}

/* ---------- My tips ---------- */
.todo{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;cursor:pointer;text-align:left;
  background:var(--gold);border:0;border-radius:var(--rs);color:var(--gold-ink);padding:12px 16px;margin-bottom:12px;font-size:16px;box-shadow:0 3px 0 var(--gold-d)}
.todo:active{transform:translateY(1px);box-shadow:0 2px 0 var(--gold-d)}
.todo b{font-weight:800}
.todo span{display:inline-flex;align-items:center;gap:3px;font-weight:800}
.mylist{padding:0;overflow:hidden}
.mr{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mr:last-child{border-bottom:0}
.mr:hover{background:var(--soft)}
.mr.pl1,.mr.pl1:hover{background:var(--gold-soft);box-shadow:inset 5px 0 0 var(--gold-d)}
.mr.pl2,.mr.pl2:hover{background:var(--silver-soft);box-shadow:inset 5px 0 0 var(--silver-d)}
.mr.pl3,.mr.pl3:hover{background:var(--bronze-soft);box-shadow:inset 5px 0 0 var(--bronze-d)}
.mmain{flex:1;min-width:0}
.mrace{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtime{display:inline-block;min-width:66px;margin-right:6px;font-variant-numeric:tabular-nums}
.mpick{display:flex;align-items:center;margin-top:3px;font-size:18px;min-width:0}
.mpick b{font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpick .muted{margin-left:8px;white-space:nowrap}
.mpick.none{color:var(--faint);font-size:15.5px}
.mr.need .mpick.none{color:var(--amber);font-weight:700}
.mright{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:14px;text-align:right;font-size:17px}
.mright .pts,.mright .zero{min-width:74px}
.mright .pts{font-size:19px}
.mgo{display:inline-flex;align-items:center;gap:2px;font-size:15.5px;font-weight:700;color:var(--turf)}
.mgo .ico{width:14px;height:14px}
@media (min-width:860px){
  .mmain{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:16px}
  .mrace{font-size:15.5px;color:var(--ink2)}
  .mpick{margin-top:0}
}

/* ---------- Scoreboard ---------- */
.gtools{margin-bottom:10px;gap:8px 18px}
.gtools .seg{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:15px;height:15px;border-radius:5px}
.lg.p1{background:var(--gold)}.lg.p2{background:var(--silver)}.lg.p3{background:var(--bronze)}
.legend .ico{width:14px;height:14px}
.lgs{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.lgs s{font-weight:400;opacity:.7}
.gwrap{overflow:auto;max-height:calc(100vh - 90px);margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 0 rgba(20,38,27,.04);-webkit-overflow-scrolling:touch}
.gtable{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;margin:0;font-size:15px}
.gtable th,.gtable td{padding:0;white-space:nowrap;border-bottom:1px solid var(--line)}
.gtable tbody tr:last-child th,.gtable tbody tr:last-child td{border-bottom:0}
.gtable thead th{position:sticky;top:0;z-index:3;background:var(--soft);border-bottom:1px solid var(--line2);font-weight:400}
.gtable thead th.gname{z-index:4;left:0;text-align:left;padding:0 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.gtot-h{float:right}
.gtable .gname{width:236px;min-width:236px;max-width:236px}
.grace{min-width:78px;text-align:center;padding:8px 4px 8px !important}
.grno{font-weight:800;font-size:15px;color:var(--ink)}

<script>
/* ============ SETTINGS — paste your Apps Script web app URL here ============ */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0rrstoVuFzDhXOAJ2se_iOC124T5UJmi7ZiaNbkO727MUsitORn6tRGCVhXCWUnYN/exec';

/* ============ Plumbing ============ */
var S = null;               // server state
var P = {};                 // url params
var TOKEN = '', ADMIN = '';
var UI = { tab:null, dayId:null, lbMode:'carnival', statMode:'carnival', statSort:'total', raceId:null,
           compare:[], draft:{}, adminRace:null, adminDay:'', pins:null, gridSort:'rank' };
var D = {};                 // derived lookups

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ return '$' + (Number(n)||0).toFixed(2); }
var ICO={ lock:'<rect x="3" y="7.2" width="10" height="6.8" rx="1.6"/><path d="M5.4 7.2V5.1a2.6 2.6 0 0 1 5.2 0v2.1"/>',
  clock:'<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.3 1.5"/>',
  check:'<path d="M3.2 8.6l3 3 6.4-7.2"/>',
  pin:'<path d="M5.4 2.2h5.2l-.7 4 2.3 2.6H3.8l2.3-2.6z"/><path d="M8 8.8v5"/>',
  next:'<path d="M6 3.2l4.8 4.8L6 12.8"/>', prev:'<path d="M10 3.2L5.2 8l4.8 4.8"/>' };
function ico(n){ return '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">'+ICO[n]+'</svg>'; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }
function inAppsScript(){ return !!(window.google && google.script && google.script.run); }
function api(fn){
  var args=[].slice.call(arguments,1);
  if(inAppsScript()) return new Promise(function(res,rej){
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e);});
    r[fn].apply(r,args);
  });
  if(!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL))
    return Promise.reject(new Error('Setup needed: paste your Apps Script web app URL into SCRIPT_URL in index.html'));
  // text/plain body keeps this a "simple" request, so the browser skips the CORS preflight Apps Script can't answer
  return fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){ if(!r.ok) throw new Error('Server error '+r.status); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error); return j.data; });
}
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
function getParams(){
  return new Promise(function(res){
    try{ if(window.google && google.script && google.script.url){ google.script.url.getLocation(function(l){res(l.parameter||{});}); return; } }catch(e){}
    var o={}; new URLSearchParams(location.search).forEach(function(v,k){o[k]=v;}); res(o);
  });
}
function fail(e){
  var m=(e && e.message) || String(e);
  if(/permission/i.test(m) && /UrlFetch|external_request|ScriptApp|scriptapp/i.test(m)){
    showModal('Google needs your approval first',
      'Google has not yet been given permission to read TABtouch (or to run on a timer).\n\nTo fix it, once:\n1. Open your Google Sheet, then Extensions > Apps Script.\n2. In the function dropdown next to Run, choose: authorise\n3. Click Run.\n4. Click Review permissions, choose your account, then Advanced > Go to (your project) > Allow.\n5. Come back here and try again. No redeploy is needed.\n\nGoogle said: '+m);
    return;
  }
  if(!S){ document.getElementById('view').innerHTML='<div class="empty">'+esc(m)+'</div>'; }
  if(S && m.length>90){ var t=document.getElementById('toast'); if(t) t.classList.remove('show'); showModal('That did not work', m); return; }
  toast(m);
}

/* ============ Time ============ */
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); }
function fmtDay(d){ if(!d) return ''; var x=new Date(d+'T12:00:00'); return x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function until(iso){
  var ms=Date.parse(iso)-Date.now(); if(ms<=0) return 'jumped';
  var m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return 'jumps in '+d+'d '+(h%24)+'h';
  if(h>0) return 'jumps in '+h+'h '+(m%60)+'m';
  return 'jumps in '+m+'m';
}
function isLocked(r){ return Date.parse(r.lock||r.start) <= Date.now(); }
function started(r){ return Date.parse(r.start) <= Date.now(); }
function fmtLeft(ms){
  var m=Math.max(0,Math.floor(ms/60000)), hh=Math.floor(m/60), d=Math.floor(hh/24);
  if(d>0) return d+'d '+(hh%24)+'h'; if(hh>0) return hh+'h '+(m%60)+'m'; return m+'m';
}
function fmtWhen(iso){ var x=new Date(iso); return x.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+' '+x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
/* The day's lock time = earliest race lock that day (normally the admin-set lock time) */
function dayLock(dayId){
  var rs=D.byDay[dayId]||[]; if(!rs.length) return null;
  return new Date(Math.min.apply(null,rs.map(function(r){return Date.parse(r.lock||r.start);}))).toISOString();
}

/* ============ Derived data & scoring ============ */
function derive(){
  D.race={}; D.day={}; D.res={}; D.byDay={}; D.tip={}; D.player={};
  S.players.forEach(function(p){ D.player[p.id]=p; });
  S.days.forEach(function(d){ D.day[d.id]=d; D.byDay[d.id]=[]; });
  S.races.forEach(function(r){ D.race[r.id]=r; (D.byDay[r.dayId]=D.byDay[r.dayId]||[]).push(r); });
  Object.keys(D.byDay).forEach(function(k){ D.byDay[k].sort(function(a,b){return a.raceNo-b.raceNo;}); });
  S.results.forEach(function(x){ D.res[x.raceId]=x; });
  S.tips.forEach(function(t){ (D.tip[t.p]=D.tip[t.p]||{})[t.r]=String(t.h); });
}
function hasResult(raceId){ var x=D.res[raceId]; return !!(x && x.placings && x.placings.length); }
function effHorse(raceId,h){
  var x=D.res[raceId]; if(!x||!h) return h;
  if((x.scratched||[]).map(String).indexOf(String(h))>=0 && x.favourite) return String(x.favourite);
  return String(h);
}
function points(pid,raceId){
  if(!hasResult(raceId)) return null;
  var h=effHorse(raceId,(D.tip[pid]||{})[raceId]); if(!h) return 0;
  var s=0; D.res[raceId].placings.forEach(function(pl){ if(String(pl.no)===h) s+=(Number(pl.win)||0)+(Number(pl.place)||0); });
  return Math.round(s*100)/100;
}
function dayTotal(pid,dayId){ return (D.byDay[dayId]||[]).reduce(function(s,r){ return s+(points(pid,r.id)||0); },0); }
function carnivalTotal(pid){ return S.days.reduce(function(s,d){ return s+dayTotal(pid,d.id); },0); }
function ranked(list,key){
  var arr=list.slice().sort(function(a,b){ return b[key]-a[key] || a.name.localeCompare(b.name); });
  arr.forEach(function(x,i){ x.rank = (i>0 && Math.abs(arr[i-1][key]-x[key])<0.001) ? arr[i-1].rank : i+1; });
  return arr;
}
function horseName(race,no){
  if(!no) return '';
  var r=(race.runners||[]).find(function(x){return String(x.no)===String(no);});
  return r ? r.name : '#'+no;
}
function placingOf(raceId,no){
  var x=D.res[raceId]; if(!x) return null;
  var p=(x.placings||[]).find(function(pl){ return String(pl.no)===String(no); });
  return p || null;
}
function cloth(no){ return '<span class="cloth">'+esc(no)+'</span>'; }
function rno(r){ return '<span class="rno">R'+r.raceNo+'</span>'; }
function ordinal(n){ return ['','1st','2nd','3rd'][n] || (n+'th'); }
function defaultDay(){
  if(!S.days.length) return null;
  // 1) a day being raced now, 2) the next day still open for tips, 3) the most recent day with results
  var live=S.days.filter(function(d){ var rs=D.byDay[d.id]||[]; return rs.some(started) && !rs.every(function(r){return hasResult(r.id);}); })[0];
  if(live) return live.id;
  var open=S.days.filter(function(d){ var rs=D.byDay[d.id]||[]; return rs.length && !rs.some(isLocked); })[0];
  if(open) return open.id;
  var withRes=S.days.filter(function(d){ return (D.byDay[d.id]||[]).some(function(r){return hasResult(r.id);}); });
  return (withRes.length ? withRes[withRes.length-1] : S.days[0]).id;
}

/* ============ Shell ============ */
var TABS=[['mine','My tips'],['tips','Races'],['grid','Scoreboard'],['board','Ladder'],['stats','Stats']];
function renderShell(){
  document.getElementById('title').textContent=S.title;
  document.title=S.title;
  document.getElementById('who').innerHTML = (S.me ? '<b>'+esc(S.me.name)+'</b>' : (S.isAdmin ? '' : 'View only'))+(S.isAdmin?'<span class="tag">Admin</span>':'');
  var tabs=TABS.slice(); if(S.isAdmin) tabs.push(['admin','Admin']);
  var nav=document.getElementById('tabs');
  nav.innerHTML=tabs.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(UI.tab===t[0]?'on':'')+'">'+t[1]+'</button>'; }).join('');
  var on=nav.querySelector('.on'); if(on) nav.scrollLeft=Math.max(0,on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2);
}
function render(){
  renderShell();
  var v=document.getElementById('view');
  if(!UI.tab) UI.tab = (S.me || S.isAdmin) ? 'mine' : 'tips';
  if(UI.tab==='races') UI.tab='tips';
  var fn={mine:vMine,tips:vTips,grid:vGrid,board:vBoard,stats:vStats,admin:vAdmin}[UI.tab]||vTips;
  v.innerHTML = fn();
  renderSaveBar();
}
function dayStatus(d){
  var rs=D.byDay[d.id]||[];
  if(!rs.length) return {k:'up',t:'Upcoming'};
  if(rs.every(function(r){return hasResult(r.id);})) return {k:'done',t:'Done'};
  if(rs.some(started)) return {k:'live',t:'Live'};
  if(rs.some(isLocked)) return {k:'locked',t:'Locked'};
  var next=S.days.filter(function(x){ var r2=D.byDay[x.id]||[]; return r2.length && !r2.some(isLocked); })[0];
  return (next && next.id===d.id) ? {k:'soon',t:'Tips open'} : {k:'up',t:'Upcoming'};
}
function dayChips(){
  if(!S.days.length) return '';
  return '<div class="days">'+S.days.map(function(d){
    var st=dayStatus(d);
    return '<button class="dayb'+(UI.dayId===d.id?' on':'')+'" data-day="'+esc(d.id)+'">'+
      '<span class="dn">'+esc(d.name)+'</span><span class="dm"><span class="dd">'+esc(fmtDay(d.date))+'</span><span class="ds '+st.k+'"><i></i>'+st.t+'</span></span></button>';
  }).join('')+'</div>';
}
function noDays(){ return '<div class="empty">No race days set up yet.</div>'; }

/* ============ My tips ============ */
/* ---------- Silks: draw racing colours from a description like "Royal Blue, White Hoops, Red Sleeves, Yellow Cap" ---------- */
var SILK_COLS={'royal blue':'#2446B8','navy blue':'#1B2A55','navy':'#1B2A55','dark blue':'#1B2A55','light blue':'#8EC9EE','sky blue':'#8ED4F5','pale blue':'#BFE3F7','blue':'#2E6FD8',
 'emerald green':'#0F8A4B','dark green':'#15502C','lime green':'#9BD13B','lime':'#9BD13B','green':'#2E9E4F','black':'#1A1A1A','white':'#FFFFFF','red':'#D8262E','scarlet':'#E0301E','crimson':'#B3122E',
 'maroon':'#6E1426','cerise':'#DE3163','pink':'#F58BB7','hot pink':'#FF4F9A','purple':'#6A2C91','mauve':'#B784A7','violet':'#7B3FB0','lilac':'#C8A2C8','yellow':'#FFD91F','lemon':'#FFF36B',
 'gold':'#D4A017','orange':'#FF8A1F','tangerine':'#FF9933','brown':'#6B4226','beige':'#E6D3B3','fawn':'#D2B48C','grey':'#9AA0A6','gray':'#9AA0A6','silver':'#C0C6CC','aqua':'#35C6D6','turquoise':'#30C4C0'};
var SILK_KEYS=Object.keys(SILK_COLS).sort(function(a,b){return b.length-a.length;});
var PATS=['cross belts','crossbelts','armbands','armlets','epaulettes','quartered','quarters','diamonds','diamond','chevrons','chevron','checks','check','stripes','stripe','hoops','hoop','spots','spot','stars','star','sash','halved','band','seams','braces'];
function silkCols(seg){ var s=seg.toLowerCase(), out=[]; var i=0;
  while(i<s.length){ var hit=null; for(var k=0;k<SILK_KEYS.length;k++){ if(s.substr(i,SILK_KEYS[k].length)===SILK_KEYS[k]){ hit=SILK_KEYS[k]; break; } }
    if(hit && (i===0||/\W/.test(s[i-1]))){ out.push(SILK_COLS[hit]); i+=hit.length; } else i++; }
  return out; }
function parseSilks(desc){
  var o={base:'#fff',pat:null,pc:null,sleeves:null,sp:null,spc:null,cap:null};
  String(desc||'').split(/[,;]/).forEach(function(seg,idx){
    var s=seg.toLowerCase().trim(); if(!s) return; var cols=silkCols(s);
    var pat=null; for(var k=0;k<PATS.length;k++){ if(s.indexOf(PATS[k])>=0){ pat=PATS[k]; break; } }
    if(/sleeve/.test(s)){ o.sleeves=cols[0]||o.sleeves; if(pat){ o.sp=pat; o.spc=cols[1]||cols[0]; } return; }
    if(/cap/.test(s)){ o.cap=cols[0]||o.cap; return; }
    if(idx===0){ o.base=cols[0]||o.base; if(pat){ o.pat=pat; o.pc=cols[1]||cols[0]; } return; }
    if(pat){ o.pat=pat; o.pc=cols[0]||o.pc; }
  });
  return o;
}
var silkN=0;
function silksSVG(desc){
  if(!desc) return '';
  var o=parseSilks(desc), id='sk'+(silkN++), b=o.base, c=o.pc||'#fff', p=(o.pat||'').replace(/s$/,'');
  var shirt='M25 12L33 8Q40 14 47 8L55 12L76 27L67 42L57 35L57 72L23 72L23 35L13 42L4 27Z';
  var body='';
  switch(p){
    case 'hoop': for(var y=16;y<76;y+=14) body+='<rect x="0" y="'+y+'" width="80" height="7" fill="'+c+'"/>'; break;
    case 'band': body='<rect x="0" y="40" width="80" height="12" fill="'+c+'"/>'; break;
    case 'stripe': for(var x=26;x<58;x+=9) body+='<rect x="'+x+'" y="0" width="4.5" height="76" fill="'+c+'"/>'; break;
    case 'diamond': body='<pattern id="'+id+'d" width="11" height="14" patternUnits="userSpaceOnUse"><path d="M5.5 0L11 7L5.5 14L0 7Z" fill="'+c+'"/></pattern><rect x="23" width="34" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'spot': body='<pattern id="'+id+'d" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.6" fill="'+c+'"/></pattern><rect width="80" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'check': body='<pattern id="'+id+'d" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="'+c+'"/><rect x="8" y="8" width="8" height="8" fill="'+c+'"/></pattern><rect width="80" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'sash': body='<path d="M28 10L38 10L60 70L50 74Z" fill="'+c+'"/>'; break;
    case 'cross belt': case 'crossbelt': body='<path d="M26 10L34 10L58 70L50 74Z M54 10L46 10L22 70L30 74Z" fill="'+c+'"/>'; break;
    case 'chevron': for(var y2=24;y2<72;y2+=14) body+='<path d="M23 '+y2+'L40 '+(y2+10)+'L57 '+y2+'" stroke="'+c+'" stroke-width="5" fill="none"/>'; break;
    case 'star': body=[[33,30],[47,40],[35,54],[48,64]].map(function(q){ return '<path transform="translate('+q[0]+' '+q[1]+') scale(.9)" d="M0-6L1.8-1.9L6.3-1.9L2.7 0.9L4 5.4L0 2.7L-4 5.4L-2.7 0.9L-6.3-1.9L-1.8-1.9Z" fill="'+c+'"/>'; }).join(''); break;
    case 'quartered': case 'quarter': body='<rect x="40" y="0" width="40" height="40" fill="'+c+'"/><rect x="0" y="40" width="40" height="40" fill="'+c+'"/>'; break;
    case 'halved': body='<rect x="40" y="0" width="40" height="76" fill="'+c+'"/>'; break;
    case 'epaulette': body='<path d="M25 12L33 8L36 16L26 20Z M55 12L47 8L44 16L54 20Z" fill="'+c+'"/>'; break;
    case 'brace': body='<rect x="29" y="0" width="5" height="76" fill="'+c+'"/><rect x="46" y="0" width="5" height="76" fill="'+c+'"/>'; break;
    case 'seam': body='<rect x="38.5" y="0" width="3" height="76" fill="'+c+'"/>'; break;
  }
  var sl=o.sleeves||null, sleeves='';
  if(sl) sleeves='<path d="M25 12L4 27L13 42L23 35Z M55 12L76 27L67 42L57 35Z" fill="'+sl+'"/>';
  if(o.sp && /arm|hoop|band/.test(o.sp)) sleeves+='<path d="M9 23L18 38M14 19L22 32 M71 23L62 38M66 19L58 32" stroke="'+(o.spc||'#fff')+'" stroke-width="4"/>';
  var cap=o.cap||b;
  return '<svg class="silk" viewBox="0 -12 80 88" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+shirt+'"/></clipPath></defs>'+
    '<g clip-path="url(#'+id+')"><rect x="0" y="0" width="80" height="76" fill="'+b+'"/>'+body+sleeves+'</g>'+
    '<path d="'+shirt+'" fill="none" stroke="#15361F" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<path d="M28 4Q40 -14 52 4Z" fill="'+cap+'" stroke="#15361F" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 4L60 5" stroke="#15361F" stroke-width="3" stroke-linecap="round"/></svg>';
}
/* Racing colours: TABtouch has one image per race at a fixed link,
   https://www.tabtouch.com.au/misc/silkspriteimage/<date>/<meeting>/<race>
   with the silks in a row in runner order. Each silk is 20px wide and 24px high. */
var SILK_W=20, SILK_H=24;
function silkFor(r,raceId,size){
  size=size||38;
  if(r.si && r.sx!=null && r.sx!==''){
    var url=String(r.si).replace(/\/(true|false)$/,''), sc=size/SILK_W;
    return '<span class="silkbox" style="width:'+size+'px;height:'+Math.round(SILK_H*sc)+'px"><span class="silksp" style="width:'+SILK_W+'px;height:'+SILK_H+'px;transform:scale('+sc.toFixed(3)+')">'+
      '<img src="'+esc(url)+'" style="margin-left:-'+(SILK_W*Number(r.sx))+'px" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.parentNode.style.visibility=\'hidden\'"></span></span>';
  }
  return r.si ? '<img class="silk" src="'+esc(r.si)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : silksSVG(r.s);
}
function formPills(f){
  if(!f) return '';
  return '<span class="form"><span class="flbl">Form</span>'+String(f).split('').map(function(ch){
    var k= ch==='1'?'f1':(ch==='2'||ch==='3')?'f23':(ch.toLowerCase()==='x')?'fx':'fo';
    return '<i class="'+k+'">'+esc(ch.toLowerCase()==='x'?'x':ch)+'</i>';
  }).join('')+'</span>';
}

/* ---------- My tips: your whole day at a glance ---------- */
function vMine(){
  if(!S.me){
    if(S.isAdmin) return '<div class="card"><h3>Tip as a player</h3><div class="muted" style="margin:4px 0 10px">Your admin link doesn\'t know which player you are. Choose yourself to see and enter your tips. Your admin tools stay available.</div>'+
      '<select id="asPlayer" style="width:100%"><option value="">Choose a player…</option>'+S.players.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join('')+'</select>'+
      (S.players.length?'':'<div class="muted" style="margin-top:8px">Add players on the Admin tab first.</div>')+'</div>';
    return '<div class="card"><h3>Open your personal link</h3><div class="muted" style="margin-top:4px">My tips shows your own tips, so it needs the personal link the organiser sent you. You can still browse Races, the Scoreboard and the Ladder.</div></div>';
  }
  if(!S.days.length) return noDays();
  var races=D.byDay[UI.dayId]||[];
  var out=dayChips();
  if(S.me){
    var dayRows=ranked(S.players.map(function(p){return {id:p.id,name:p.name,t:dayTotal(p.id,UI.dayId)};}),'t');
    var carRows=ranked(S.players.map(function(p){return {id:p.id,name:p.name,t:carnivalTotal(p.id)};}),'t');
    var dm=dayRows.find(function(x){return x.id===S.me.id;}), cm=carRows.find(function(x){return x.id===S.me.id;});
    var picked=races.filter(function(r){ return curPick(r); }).length;
    out+='<div class="hero">'+
      '<div class="stat"><div class="lbl">This day</div><div class="big">'+money(dm.t)+'</div><div class="sub">'+(races.some(function(r){return hasResult(r.id);})?ordinal(dm.rank)+' of '+dayRows.length:'No results yet')+'</div></div>'+
      '<div class="stat"><div class="lbl">Carnival</div><div class="big">'+money(cm.t)+'</div><div class="sub">'+(S.results.some(function(x){return hasResult(x.raceId);})?ordinal(cm.rank)+' of '+carRows.length:'No results yet')+'</div></div>'+
      '<div class="stat"><div class="lbl">Tipped</div><div class="big">'+picked+'/'+races.length+'</div><div class="sub">races this day</div></div></div>';
  }
  if(!races.length) return out+'<div class="empty">No fields yet. Check back after acceptances.</div>';
  out+=lockBanner(UI.dayId);
  var open=races.filter(function(r){ return !isLocked(r) && !curPick(r); });
  if(open.length) out+='<button class="todo" data-gorace="'+esc(open[0].id)+'"><b>'+open.length+' race'+(open.length>1?'s':'')+' still to tip</b><span>Tip now'+ico('next')+'</span></button>';
  out+='<div class="card mylist">'+races.map(function(r){
    var p=curPick(r), locked=isLocked(r), h=p?(r.runners.find(function(x){return String(x.no)===p;})||{no:p,name:horseName(r,p)}):null;
    var eff=effHorse(r.id,p), pl=(p&&hasResult(r.id))?placingOf(r.id,eff):null, pt=S.me?points(S.me.id,r.id):null;
    var right;
    if(pt!=null) right=(pl?'<span class="medal p'+pl.pos+'">'+ordinal(pl.pos)+'</span>':'')+'<span class="'+(pt>0?'pts':'zero')+'">'+(pt>0?'+'+money(pt):'$0.00')+'</span>';
    else if(started(r)) right='<span class="pill closed">Jumped</span>';
    else if(locked) right='<span class="pill closed">'+ico('lock')+'Locked</span>';
    else right='<span class="mgo">'+(p?'Change':'Pick')+ico('next')+'</span>';
    return '<div class="mr'+(!p&&!locked?' need':'')+(pl?' pl'+pl.pos:'')+'" data-gorace="'+esc(r.id)+'" role="button" tabindex="0">'+
      rno(r)+
      '<div class="mmain"><div class="mrace"><span class="mtime">'+fmtTime(r.start)+'</span>'+esc(r.name)+'</div>'+
      (h ? '<div class="mpick">'+((h.s||h.si)?'<span class="msilk">'+silkFor(h,r.id,26)+'</span>':'')+cloth(h.no)+'<b>'+esc(h.name)+'</b>'+
             (eff!==p?'<span class="muted">scratched, runs as fav #'+esc(eff)+'</span>':'')+
             '</div>'
         : '<div class="mpick none">'+(locked?'No tip':'Not tipped yet')+'</div>')+
      '</div><div class="mright">'+right+'</div></div>';
  }).join('')+'</div>';
  return out;
}

/* ---------- My tips: one race at a time, tap a horse ---------- */
function curPick(r){ if(!S.me) return ''; var d=UI.draft[r.id]; return d!=null ? String(d) : String((D.tip[S.me.id]||{})[r.id]||''); }
function tipRaceFor(dayId){
  UI.tipRace=UI.tipRace||{};
  var races=D.byDay[dayId]||[], cur=UI.tipRace[dayId];
  if(cur && races.some(function(r){return r.id===cur;})) return cur;
  var pick = (S.me && races.filter(function(r){ return !isLocked(r) && !curPick(r); })[0]) ||
             races.filter(function(r){ return !hasResult(r.id); })[0] || races[0];
  return pick ? pick.id : null;
}
function vTips(){
  if(!S.days.length) return noDays();
  var races=D.byDay[UI.dayId]||[];
  var out=dayChips();
  if(!races.length) return out+'<div class="empty">No fields yet. Check back after acceptances.</div>';
  out+=lockBanner(UI.dayId);
  var rid=tipRaceFor(UI.dayId); UI.tipRace[UI.dayId]=rid;
  var r=D.race[rid], idx=races.indexOf(r);

  // race buttons: tick + your horse number
  out+='<div class="rbtns">'+races.map(function(x){
    var p=curPick(x), done=hasResult(x.id);
    return '<button class="rb'+(x.id===rid?' on':'')+(p?' has':'')+'" data-tipr="'+esc(x.id)+'"><b>R'+x.raceNo+'</b><span>'+(p?'#'+esc(p):((S.me&&!isLocked(x)&&!done)?'Tip':'–'))+'</span></button>';
  }).join('')+'</div>';

  var res=D.res[r.id]||{}, scr=(res.scratched||[]).map(String), locked=isLocked(r), canPick=!!S.me && !locked;
  var mine=curPick(r), eff=effHorse(r.id,mine);
  var status = hasResult(r.id) ? '<span class="pill result">'+(res.status==='interim'?'Interim result':'Result')+'</span>' :
               started(r) ? '<span class="pill closed">Jumped</span>' : locked ? '<span class="pill closed">'+ico('lock')+'Locked</span>' : '<span class="pill open">Open</span>';
  out+='<div class="card racehead"><div class="row"><h3>'+rno(r)+esc(r.name)+'</h3><span class="sp"></span>'+status+'</div>'+
    '<div class="muted meta">'+fmtTime(r.start)+' your time · '+r.runners.length+' runners'+(res.favourite?' · Fav #'+esc(res.favourite):'')+'</div>';
  if(S.me && (locked || mine)){
    var pt=points(S.me.id,r.id);
    out+='<div class="yourtip"><span class="muted">Your tip</span> <b>'+(mine? cloth(mine)+esc(horseName(r,mine)) : '<span class="muted">none</span>')+'</b>'+
      (mine && eff!==mine ? ' <span class="muted">→ scratched, runs as fav #'+esc(eff)+'</span>':'')+
      (pt!=null ? '<span class="sp"></span><span class="'+(pt>0?'pts':'zero')+'">'+(pt>0?'+'+money(pt):'$0.00')+'</span>' : '')+'</div>';
  }
  if(canPick && mine && scr.indexOf(mine)>=0) out+='<div class="warn">Your horse is scratched. Pick again, or it switches to the favourite.</div>';
  out+='</div>';
  if(hasResult(r.id)) out+=resultBoard(r);

  // who tipped what (after lock)
  var visible=locked || S.isAdmin, tippers={}, nT=0;
  if(visible) S.players.forEach(function(p){ var t=(D.tip[p.id]||{})[r.id]; if(t){ var e=effHorse(r.id,t); (tippers[e]=tippers[e]||[]).push(p.name); nT++; } });

  out+=canPick?'<div class="muted note">Tap a horse to pick it. Tips save automatically.</div>':'';
  var anySilk=r.runners.some(function(x){ return x.s||x.si; });
  out+='<div class="card pickl'+(anySilk?'':' ns')+'">'+r.runners.map(function(hh){
    var no=String(hh.no), isScr=scr.indexOf(no)>=0, sel=(mine===no), pl=hasResult(r.id)?placingOf(r.id,no):null;
    var who=tippers[no]||[], meta=[];
    if(hh.j) meta.push('J: '+esc(hh.j)); if(hh.t) meta.push('T: '+esc(hh.t)); if(hh.w) meta.push(esc(hh.w)+'kg');
    var cls='rr'+(sel?' sel':'')+(isScr?' is-scr':'')+(canPick&&!isScr?' tap':'')+(pl?' pl'+pl.pos:'');
    return '<div class="'+cls+'"'+(canPick&&!isScr?' data-pickh="'+esc(no)+'" role="button" tabindex="0"':'')+'>'+
      (anySilk?'<div class="rsilk">'+silkFor(hh,r.id,32)+'</div>':'')+
      '<div class="rnum">'+esc(no)+'</div>'+
      '<div class="rmain"><div class="rname"><span class="'+(isScr?'scr':'')+'">'+esc(hh.name)+'</span>'+(hh.bar?'<span class="rbar">('+esc(hh.bar)+')</span>':'')+
        (String(res.favourite)===no?'<span class="pill result">Fav</span>':'')+(isScr?'<span class="pill closed">Scratched</span>':'')+'</div>'+
        (meta.length?'<div class="rmeta">'+meta.join(' · ')+'</div>':'')+
        (visible&&who.length?'<div class="muted rwho">'+esc(who.join(', '))+'</div>':'')+
      '</div>'+
      '<div class="rmid">'+
        (pl?'<span class="rres"><span class="medal p'+pl.pos+'">'+ordinal(pl.pos)+'</span><span class="num">'+(pl.win?money(pl.win)+' / ':'')+money(pl.place)+'</span></span>':'')+
        formPills(hh.f)+'</div>'+
      '<div class="rright">'+(canPick? (isScr?'':'<span class="radio">'+(sel?ico('check'):'')+'</span>') :
        (visible?(who.length?'<b>'+who.length+'</b><span>'+(who.length===1?'tip':'tips')+'</span>':'<span class="zero">–</span>'):(sel?'<span class="radio">'+ico('check')+'</span>':'')))+'</div>'+
    '</div>';
  }).join('')+'</div>';

  var prev=races[idx-1], next=races[idx+1];
  out+='<div class="rnav">'+(prev?'<button class="btn ghost" data-tipr="'+esc(prev.id)+'">'+ico('prev')+'Race '+prev.raceNo+'</button>':'<span></span>')+
    (next?'<button class="btn '+(mine||!canPick?'gold':'ghost')+'" data-tipr="'+esc(next.id)+'">Race '+next.raceNo+ico('next')+'</button>':'<span></span>')+'</div>';
  return out;
}
function lockBanner(dayId,onGrid){
  var l=dayLock(dayId); if(!l) return '';
  var left=Date.parse(l)-Date.now();
  if(left>0) return '<div class="lockban open">'+ico('clock')+'<div><b>Tips lock '+esc(fmtWhen(l))+'</b>'+fmtLeft(left)+' to go. '+(onGrid?'Everyone\'s tips show here once they lock.':'You can change your tips until then.')+'</div></div>';
  return '<div class="lockban shut">'+ico('lock')+'<div><b>Tips locked '+esc(fmtWhen(l))+'</b>Everyone\'s tips are in.'+(onGrid?'':' See them all on the <button class="lnk" data-tab="grid">Scoreboard</button>.')+'</div></div>';
}
/* The judge's board: the placegetters' numbers, big, with what they paid */
function resultBoard(r){
  var x=D.res[r.id];
  return '<div class="board">'+(x.status==='interim'?'<div class="bhead">Interim result. Dividends are not final yet.</div>':'')+'<div class="bgrid">'+
    x.placings.slice().sort(function(a,b){return a.pos-b.pos;}).map(function(pl){
      var h=r.runners.find(function(q){return String(q.no)===String(pl.no);})||{};
      return '<div class="bplace p'+pl.pos+'"><div class="bpos">'+ordinal(pl.pos)+'</div><div class="bnum">'+esc(pl.no)+'</div>'+
        '<div class="binfo"><div class="bname">'+((h.s||h.si)?silkFor(h,r.id,26):'')+'<span>'+esc(horseName(r,pl.no))+'</span></div>'+
        '<div class="bdiv">'+(pl.win?'<span>Win <b>'+money(pl.win)+'</b></span>':'')+'<span>Place <b>'+money(pl.place)+'</b></span></div></div></div>';
    }).join('')+'</div></div>';
}
function dirtyCount(){
  if(!S.me) return 0;
  return Object.keys(UI.draft).filter(function(k){ return String(UI.draft[k]) !== String((D.tip[S.me.id]||{})[k]||''); }).length;
}
function renderSaveBar(){
  var old=document.getElementById('savebar'); if(old) old.remove();
  if(!S.me || UI.tab!=='tips') return;
  var races=D.byDay[UI.dayId]||[]; if(!races.length) return;
  if(races.every(isLocked) && !dirtyCount() && !SAVE.busy && !SAVE.failed) return;
  var n=dirtyCount(), picked=races.filter(function(r){return curPick(r);}).length;
  var st = SAVE.failed ? '<span class="sv bad">Not saved. Check your connection.</span>' : (SAVE.busy||n) ? '<span class="sv">Saving…</span>' : '<span class="sv ok">'+ico('check')+'Saved</span>';
  var b=document.createElement('div'); b.className='savebar'; b.id='savebar';
  b.innerHTML='<div class="in"><span><b>'+picked+' of '+races.length+'</b> tipped</span><span class="sp"></span>'+st+
    (SAVE.failed?'<button class="btn small" data-act="saveTips">Retry</button>':'')+'</div>';
  document.body.appendChild(b);
}
var SAVE={busy:false,failed:false,timer:null};
function scheduleSave(){ SAVE.failed=false; clearTimeout(SAVE.timer); SAVE.timer=setTimeout(doSave,800); renderSaveBar(); }
function doSave(){
  if(SAVE.busy){ SAVE.timer=setTimeout(doSave,400); return; }
  var sent={}; Object.keys(UI.draft).forEach(function(k){ if(String(UI.draft[k])!==String((D.tip[S.me.id]||{})[k]||'')) sent[k]=UI.draft[k]; });
  var keys=Object.keys(sent); if(!keys.length){ UI.draft={}; renderSaveBar(); return; }
  SAVE.busy=true; renderSaveBar();
  api('api_saveTips',TOKEN,keys.map(function(k){return {raceId:k,horseNo:sent[k]};}),ADMIN).then(function(st){
    SAVE.busy=false; SAVE.failed=false;

function showTip(e){

function statCharts(races,rows){
  // races in running order
  var dayIdx={}; S.days.forEach(function(d,i){ dayIdx[d.id]=i; });
  races=races.slice().sort(function(a,b){ return (dayIdx[a.dayId]-dayIdx[b.dayId]) || (a.raceNo-b.raceNo); });
  var carnival=UI.statMode!=='day', out='';
  var cum={}; S.players.forEach(function(p){ cum[p.id]=[]; var run=0; races.forEach(function(r){ run+=points(p.id,r.id)||0; cum[p.id].push(Math.round(run*100)/100); }); });
  var fin=S.players.map(function(p){ return {p:p,t:cum[p.id][races.length-1]||0}; }).sort(function(a,b){return b.t-a.t;});
  var chosen=[]; if(S.me) chosen.push(S.me.id);
  fin.forEach(function(x){ if(chosen.length<4 && chosen.indexOf(x.p.id)<0) chosen.push(x.p.id); });
  var series=chosen.map(function(pid,i){ var nm=D.player[pid].name; return {name:(S.me&&pid===S.me.id?'You':nm), short:(S.me&&pid===S.me.id?'You':nm.split(' ')[0]), color:SERIES[i], vals:cum[pid]}; });
  var others=S.players.filter(function(p){return chosen.indexOf(p.id)<0;}).map(function(p){ return {name:p.name,vals:cum[p.id]}; });
  var groups=null; if(carnival){ var seen={}; groups=races.map(function(r){ if(seen[r.dayId]) return null; seen[r.dayId]=1; var nm=(D.day[r.dayId]||{}).name||''; return nm.replace(/\s*\(demo\)/,'').replace(/ Day$/,'').split(' ')[0]; }); }
  out+='<div class="card ccard"><h3>'+(carnival?'The race for the carnival':'How the day unfolded')+'</h3><div class="muted csub">Running total after each race'+(S.me?', you and the top 3':', top 4')+'. Everyone else is in grey.</div>'+
    legend(series.concat(others.length?[{name:'Everyone else',color:'#C3C9C3'}]:[]))+
    lineChart({labels:races.map(function(r){return 'R'+r.raceNo;}), full:races.map(function(r){ return ((D.day[r.dayId]||{}).name||'')+' · R'+r.raceNo; }), groups:groups, series:series, others:others})+
    tableView(['Player','Total'],fin.map(function(x){ return [x.p.name,money(x.t)]; }))+'</div>';

  HALF=true; out+='<div class="cgrid">';
  if(carnival){
    var items=S.days.filter(function(d){ return (D.byDay[d.id]||[]).some(function(r){return hasResult(r.id);}); }).map(function(d){
      var best=null; S.players.forEach(function(p){ var t=dayTotal(p.id,d.id); if(!best||t>best.t) best={p:p,t:t}; });
      return {label:d.name.replace(/\s*\(demo\)/,'').replace(/ Day$/,'').split(' ')[0], full:d.name, value:best?best.t:0, who:best?best.p.name:'', dot:S.me?dayTotal(S.me.id,d.id):null};
    });
    out+='<div class="card ccard"><h3>Winning score each day</h3><div class="muted csub">The day winner\'s total'+(S.me?', with your score as a dot':'')+'.</div>'+
      (S.me?legend([{name:'Day winner',color:SERIES[0]},{name:'You',color:'#17201B',dot:true}]):'')+
      colChart({items:items,dotColor:'#17201B',tip:function(it){ return '<b>'+esc(it.full)+'</b><div>Winner: '+esc(it.who)+'<span>'+money(it.value)+'</span></div>'+(it.dot!=null?'<div>You<span>'+money(it.dot)+'</span></div>':''); }})+
      tableView(['Day','Winner','Winning score'].concat(S.me?['You']:[]),items.map(function(it){ return [it.full,it.who,money(it.value)].concat(S.me?[money(it.dot)]:[]); }))+'</div>';
  } else {
    var nT=function(r){ return S.players.filter(function(p){ return (D.tip[p.id]||{})[r.id]; }).length; };
    var items2=races.map(function(r){ var n=nT(r), hit=S.players.filter(function(p){ return (points(p.id,r.id)||0)>0; }).length;
      var w=D.res[r.id].placings.filter(function(x){return x.pos===1;})[0];
      return {label:'R'+r.raceNo, full:'R'+r.raceNo+' · '+r.name, value:n?Math.round(hit/n*100):0, hit:hit, n:n, w:w?('#'+w.no+' '+horseName(r,w.no)+' '+money(w.win)):''}; });
    var pct=function(v){ return Math.round(v)+'%'; };
    out+='<div class="card ccard"><h3>Easy or tough?</h3><div class="muted csub">Share of tipsters who collected in each race. Low bars mean a roughie won.</div>'+
      colChart({items:items2,fixedMax:100,fmt:pct,tip:function(it){ return '<b>'+esc(it.full)+'</b><div>Collected<span>'+it.hit+' of '+it.n+'</span></div><div>Winner<span>'+esc(it.w)+'</span></div>'; }})+
      tableView(['Race','Collected','Winner'],items2.map(function(it){ return [it.full,it.hit+' of '+it.n+' ('+it.value+'%)',it.w]; }))+'</div>';
  }
  out+=scatterCard(rows)+'</div>'; HALF=false;
  return out;
}
function scatterCard(rows){
  var top=rows.slice().sort(function(a,b){return b.total-a.total;}).slice(0,3).map(function(x){return x.id;});
  var pts=rows.filter(function(x){return x.tips>0;}).map(function(x){ var me=S.me&&x.id===S.me.id;
    return {name:x.name,x:x.strike,y:x.avg,total:x.total,hits:x.hits,tips:x.tips,color:me?SERIES[0]:null,label:me?'You':(top.indexOf(x.id)>=0?x.name.split(' ')[0]:'')}; });
  if(!pts.length) return '';
  return '<div class="card ccard"><h3>Safe or roughie?</h3><div class="muted csub">Right means you collect often. Up means your collects pay well. Top-right is the sweet spot.</div>'+
    (S.me?legend([{name:'You',color:SERIES[0],dot:true},{name:'Everyone else',color:'#B5BCB6',dot:true}]):'')+
    scatter({pts:pts,tip:function(p){ return '<b>'+esc(p.name)+'</b><div>Strike rate<span>'+Math.round(p.x)+'% ('+p.hits+'/'+p.tips+')</span></div><div>Avg collect<span>'+money(p.y)+'</span></div><div>Total<span>'+money(p.total)+'</span></div>'; }})+
    tableView(['Player','Strike %','Avg collect'],pts.map(function(p){ return [p.name,Math.round(p.x)+'%',money(p.y)]; }))+'</div>';
}

function vStats(){
  if(!S.days.length) return noDays();
  var out='<div class="seg"><button data-sm="carnival" class="'+(UI.statMode==='carnival'?'on':'')+'">Carnival</button><button data-sm="day" class="'+(UI.statMode==='day'?'on':'')+'">By day</button></div>';
  var races;
  if(UI.statMode==='day'){ out+=dayChips(); races=(D.byDay[UI.dayId]||[]); }
  else races=S.races.slice();
  races=races.filter(function(r){return hasResult(r.id);});
  if(!races.length) return out+'<div class="empty">Stats appear once results are in.</div>';
  var collects=[];
  var rows=S.players.map(function(p){
    var o={id:p.id,name:p.name,tips:0,wins:0,hits:0,total:0,best:0};
    races.forEach(function(r){
      var h=(D.tip[p.id]||{})[r.id]; if(!h) return;
      o.tips++;
      var pt=points(p.id,r.id)||0, pl=placingOf(r.id,effHorse(r.id,h));
      if(pl && pl.pos===1) o.wins++;
      if(pt>0){ o.hits++; o.total+=pt; o.best=Math.max(o.best,pt);
        collects.push({name:p.name,race:r,h:effHorse(r.id,h),pt:pt}); }
    });
    o.strike=o.tips?o.hits/o.tips*100:0;
    o.avg=o.hits?o.total/o.hits:0;
    return o;
  });
  out+=statCharts(races,rows);
  var k=UI.statSort;
  rows.sort(function(a,b){ return k==='name' ? a.name.localeCompare(b.name) : (b[k]-a[k]); });
  var cols=[['name','Player'],['total','Total'],['hits','Collects'],['wins','Winners'],['strike','Strike %'],['avg','Avg collect'],['best','Best']];
  out+='<div class="muted note">'+races.length+' races with results. Tap a heading to sort.</div>';
  out+='<div class="tbl-wrap"><table><thead><tr>'+cols.map(function(c){return '<th class="sort '+(c[0]!=='name'?'num':'')+(k===c[0]?' cur':'')+'" data-sort="'+c[0]+'">'+c[1]+(k===c[0]?' ↓':'')+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(x){ return '<tr class="'+(S.me&&x.id===S.me.id?'me':'')+'"><td>'+esc(x.name)+'</td><td class="num"><b>'+money(x.total)+'</b></td><td class="num">'+x.hits+'/'+x.tips+'</td><td class="num">'+x.wins+'</td><td class="num">'+x.strike.toFixed(0)+'%</td><td class="num">'+money(x.avg)+'</td><td class="num">'+money(x.best)+'</td></tr>'; }).join('')+
    '</tbody></table></div>';

  collects.sort(function(a,b){return b.pt-a.pt;});
  out+='<h2>Biggest collects</h2><div class="tbl-wrap"><table><tbody>'+collects.slice(0,8).map(function(c){
    return '<tr><td>'+esc(c.name)+'</td><td>'+esc(D.day[c.race.dayId]?D.day[c.race.dayId].name:'')+' R'+c.race.raceNo+'</td><td>'+esc(c.h)+'. '+esc(horseName(c.race,c.h))+'</td><td class="num pts">'+money(c.pt)+'</td></tr>'; }).join('')+'</tbody></table></div>';

  // Missed roughies: best-paying winners nobody (or few) tipped
  var miss=races.map(function(r){ var w=D.res[r.id].placings.find(function(p){return p.pos===1;}); if(!w) return null;
    var n=S.players.filter(function(p){return effHorse(r.id,(D.tip[p.id]||{})[r.id])===String(w.no);}).length;
    return {r:r,w:w,n:n}; }).filter(Boolean).sort(function(a,b){return b.w.win-a.w.win;}).slice(0,5);
  out+='<h2>Best-paying winners</h2><div class="tbl-wrap"><table><tbody>'+miss.map(function(m){
    return '<tr><td>'+esc(D.day[m.r.dayId]?D.day[m.r.dayId].name:'')+' R'+m.r.raceNo+'</td><td>'+esc(m.w.no)+'. '+esc(horseName(m.r,m.w.no))+'</td><td class="num">'+money(m.w.win)+'</td><td class="num muted">'+m.n+' tipped</td></tr>'; }).join('')+'</tbody></table></div>';
  return out;
}

function showModal(title,text){

    '<textarea readonly style="min-height:220px;margin-top:8px">'+esc(text)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-copy>Copy</button></div></div>';
  document.body.appendChild(m);
  var ta=m.querySelector('textarea'); ta.focus(); ta.select();
  m.addEventListener('click',function(e){
    if(e.target===m || e.target.hasAttribute('data-close')) m.remove();

      if(!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(function(){toast('Copied');},function(){toast('Select the text and copy it');}); else toast(ok?'Copied':'Select the text and copy it'); }
  });
}

  if(d.gorace){ UI.tipRace=UI.tipRace||{}; UI.tipRace[UI.dayId]=d.gorace; UI.tab='tips'; render(); window.scrollTo(0,0); var rb=document.querySelector('.rbtns'); if(rb) rb.scrollIntoView({block:'start'}); return; }
  if(d.tipr){ UI.tipRace[UI.dayId]=d.tipr; render(); var rb=document.querySelector('.rbtns'); if(rb) rb.scrollIntoView({block:'start',behavior:'smooth'}); return; }
  if(d.tab){ UI.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.day){ UI.dayId=d.day; render(); return; }
  if(d.lb){ UI.lbMode=d.lb; render(); return; }
  if(d.sm){ UI.statMode=d.sm; render(); return; }
  if(d.sort){ UI.statSort=d.sort; render(); return; }
  if(d.raceSel){ UI.raceId=d.raceSel; render(); return; }
  if(d.arace){ UI.adminRace=d.arace; render(); return; }
  if(d.cmp){ var ps=getPins(); if(ps.indexOf(d.cmp)<0) ps.push(d.cmp); setPins(ps); UI.tab='grid'; render(); window.scrollTo(0,0); return; }
  if(d.pin){ var pp=getPins(), k=pp.indexOf(d.pin); if(k>=0) pp.splice(k,1); else pp.push(d.pin); setPins(pp); render(); return; }
  if(d.gsort){ UI.gridSort=d.gsort; render(); return; }
  if(d.unpin){ setPins([]); render(); return; }
  if(d.pick){ var i=UI.compare.indexOf(d.pick);
    if(i>=0) UI.compare.splice(i,1); else { if(UI.compare.length>=6){ toast('Up to 6 players'); return; } UI.compare.push(d.pick); }
    render(); return; }
  if(d.link){ var p=D.player[d.link]; showModal(p.name+' — personal link', linkFor(p)); return; }
  if(d.reset){ if(!confirm('Give '+D.player[d.reset].name+' a new link? Their old link will stop working.')) return; admin('resetToken',{id:d.reset}); return; }
  if(d.remove){ if(!confirm('Remove '+D.player[d.remove].name+' and all their tips?')) return; admin('removePlayer',{id:d.remove}); return; }
  if(d.act) actions[d.act] && actions[d.act](t);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ') && e.target.dataset && (e.target.dataset.pickh||e.target.dataset.gorace)){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.classList.contains('pick')){ UI.draft[el.dataset.race]=el.value; var b=document.getElementById('savebar'); if(b) b.remove(); renderSaveBar(); }
  if(el.id==='dSel'){ UI.adminDay=el.value; render(); }
  if(el.id==='asPlayer' && el.value){ var pl=S.players.find(function(p){return p.id===el.value;}); if(pl && pl.token){ TOKEN=pl.token; store('tip_token',TOKEN); refresh().then(function(){ toast('Tipping as '+pl.name); }); } }
});

var actions={
  saveTips:function(){ SAVE.failed=false; doSave(); },
  saveDay:function(){
    var lk=val('dLock');
    var p={id:UI.adminDay||'',name:val('dName').trim(),date:val('dDate'),order:val('dOrder'),paste:val('dPaste'),lockAt:lk?new Date(lk).toISOString():'',tab:val('dTab').trim()};
    if(!p.name||!p.date){ toast('Name and date needed'); return; }
    admin('saveDay',p,function(st){ if(!UI.adminDay){ var nd=st.days.find(function(d){return d.name===p.name&&d.date===p.date;}); if(nd) UI.adminDay=nd.id; } UI.dayId=UI.adminDay||UI.dayId; });
  },
  tabImport:function(){ if(!UI.adminDay){ toast('Save the day first'); return; }
    var n=(D.byDay[UI.adminDay]||[]).length;
    if(n && !confirm('Replace the fields for this day with the ones on TABtouch? Tips on horse numbers that are still in the field are kept.')) return;
    var id=UI.adminDay; admin('tabImport',{dayId:id},function(){ UI.dayId=id; UI.adminRace=null; },'Importing from TABtouch… this can take 20 seconds'); },
  deleteDay:function(){ if(!confirm('Delete this day, its races, tips and results?')) return; var id=UI.adminDay; UI.adminDay=''; admin('deleteDay',{id:id}); },
  addPlayers:function(){ var tx=val('pAdd'); if(!tx.trim()) return; admin('addPlayers',{text:tx}); },
  allLinks:function(){ showModal('Player links', S.players.map(function(p){return p.name+(p.email?' <'+p.email+'>':'')+'\n'+linkFor(p);}).join('\n\n')); },
  saveCfg:function(){ admin('setConfig',{TITLE:val('cTitle'),RESULTS_URL:val('cUrl').trim(),TAB_MEETING:val('cMeet').trim()||'mr'}); },
  fetchNow:function(){ admin('fetchNow',{},null,'Checking TABtouch…'); },
  tabTest:function(){ if(!UI.adminRace){ toast('Pick a race in the Results section first'); return; } admin('tabTest',{raceId:UI.adminRace},null,'Testing…'); },
  autoOn:function(){ admin('installTrigger',{},null,'Turning on…'); },
  daySource:function(){ if(!UI.adminDay){ toast('Save the day first'); return; }
    var n=prompt('Which race number?','1'); if(n===null) return; n=parseInt(n,10)||1;
    admin('tabSource',{dayId:UI.adminDay,raceNo:n},null,'Fetching page…'); },
  tabSource:function(){ if(!UI.adminRace){ toast('Pick a race in the Results section first'); return; } admin('tabSource',{raceId:UI.adminRace},null,'Fetching page…'); },
  loadDemo:function(){ admin('loadDemo',{},function(){ UI.dayId=null; UI.adminRace=null; UI.compare=[]; }); },
  clearDemo:function(){ if(!confirm('Remove all demo players, days, tips and results?')) return; admin('clearDemo',{},function(){ UI.dayId=null; UI.adminRace=null; UI.compare=[]; }); },
  addRow:function(){ UI.extraRows=UI.extraRows||{}; UI.extraRows[UI.adminRace]=(UI.extraRows[UI.adminRace]||0)+1; render(); },
  saveResult:function(){
    var f=document.getElementById('resForm');
    var placings=[].map.call(f.querySelectorAll('.plc'),function(row){
      var no=row.querySelector('.pNo'); if(!no) return null;
      return {pos:row.querySelector('.pPos').value,no:no.value,win:row.querySelector('.pWin').value,place:row.querySelector('.pPlace').value};
    }).filter(function(x){return x && x.no;});
    var scr=[].map.call(f.querySelectorAll('.scrck:checked'),function(c){return c.value;});
    var fav=val('rFav');
    if(scr.length && !fav && placings.length){ if(!confirm('Scratchings are marked but no favourite is set — tips on scratched horses will score $0. Save anyway?')) return; }
    if(UI.extraRows) delete UI.extraRows[f.dataset.race];
    admin('saveResult',{raceId:f.dataset.race,placings:placings,scratched:scr,favourite:fav,status:document.getElementById('rInterim').checked?'interim':'final'});
  },
  clearResult:function(){ if(!confirm('Clear this result and scratchings?')) return; admin('clearResult',{raceId:UI.adminRace}); }
};
function toLocalInput(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; var p=function(n){return ('0'+n).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function admin(action,payload,after,busyMsg){
  toast(busyMsg||'Saving…');
  api('api_admin',ADMIN,action,payload,TOKEN).then(function(st){ if(after) after(st); load(st);
    if(st.source) saveSource(st.source); else if(st.diag) showDiag(st.diag); else toast(st.fetchMsg || 'Saved'); }).catch(fail);
}
function saveSource(s){
  try{ var blob=new Blob([s.html],{type:'text/html'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=s.name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast(s.status===200 ? 'Saved '+s.name : 'TABtouch returned '+s.status+'. File saved anyway.'); }
  catch(e){ showModal('Page source ('+s.status+')', s.html); }
}
function favNeeded(){   // races with a result, no favourite, and at least one tip on a scratched horse
  return S.races.filter(function(r){ var x=D.res[r.id]; if(!x || !hasResult(r.id) || x.favourite) return false;
    var scr=(x.scratched||[]).map(String); if(!scr.length) return false;
    return S.players.some(function(p){ var t=(D.tip[p.id]||{})[r.id]; return t && scr.indexOf(String(t))>=0; }); });
}
function showDiag(d){
  var ok = d.status===200 && d.parsed && d.parsed.placings && d.parsed.placings.length;
  var lines=[];
  lines.push(ok ? 'RESULT READ OK' : (d.error ? 'COULD NOT CONNECT' : d.status!==200 ? 'TABTOUCH RETURNED AN ERROR' : d.hasResultBlock ? 'PAGE FOUND, BUT NO RESULT ON IT YET' : 'PAGE FOUND, BUT NOT IN THE EXPECTED LAYOUT'));
  lines.push('');
  lines.push('Race page: '+d.url+'   (meeting code '+(d.meeting||'')+')');
  lines.push('Status: '+(d.error||d.status)+'   Size: '+(d.length||0)+' characters');
  lines.push('Result block found: '+(d.hasResultBlock?'yes':'no')+'   Placings found: '+(d.positionMarkers||0)+'   Runner numbers: '+(d.runnerNumbers||0)+(d.needsJavaScript?'   (page says it needs JavaScript)':''));
  if(d.parsed){ lines.push(''); lines.push('What would be saved:');
    d.parsed.placings.forEach(function(p){ lines.push('  '+ordinal(p.pos)+'  #'+p.no+'  win $'+p.win+'  place $'+p.place); });
    lines.push('  Favourite: '+(d.parsed.favourite?'#'+d.parsed.favourite+' (won)':'not shown on the page (TABtouch only marks it when it wins)'));
    lines.push('  Dividends official: '+(d.parsed.official?'yes':'not yet')); }
  lines.push('');
  lines.push('Runner list on the page: '+(d.starters||0)+' runners');
  if(d.starters){
    lines.push('  Favourite by lowest tote win dividend: '+(d.favByDividend?'#'+d.favByDividend:'none yet'));
    lines.push('  Scratched according to the list: '+((d.scratchedByStarters||[]).join(', ')||'none flagged'));
    if(d.field) lines.push('  Import would read: '+d.field.name+' | start '+(d.field.start||'not found')+' | first runner '+JSON.stringify(d.field.first));
    lines.push('  Field names: '+(d.starterKeys||[]).join(', '));
    lines.push('  First runner as sent: '+(d.starterSample||''));
  }
  lines.push(''); lines.push('Scratchings page: '+d.scratchUrl);
  lines.push('Status: '+(d.scratchError||d.scratchStatus)+'   Size: '+(d.scratchLength||0));
  lines.push('Scratchings read: '+(d.scratchParsed?JSON.stringify(d.scratchParsed):'meeting not found on the page'));
  lines.push(''); lines.push('----- copy everything below and send it to Claude if something is wrong -----');
  lines.push('BEFORE THE RUNNER LIST:'); lines.push(d.aroundList||'(runner list not found)'); lines.push('');
  lines.push('AFTER THE RUNNER LIST:'); lines.push(d.afterList||''); lines.push('');
  lines.push('RACE PAGE SAMPLE:'); lines.push(d.sample||''); lines.push(''); lines.push('SCRATCHINGS SAMPLE:'); lines.push(d.scratchSample||'');
  showModal('TAB connection test', lines.join('\n'));
}

/* ============ Boot ============ */
function busy(){ var a=document.activeElement; return !!document.querySelector('.modal') || SAVE.busy || (S && dirtyCount()>0) || (a && /SELECT|INPUT|TEXTAREA/.test(a.tagName)); }
function load(st){
  S=st; derive();
  var old=!(st.version>=2);
  var w=document.getElementById('oldwarn');
  if(old && !w){ w=document.createElement('div'); w.id='oldwarn'; w.className='oldwarn';
    w.innerHTML='<b>The Google script is out of date.</b> In Apps Script: paste in the latest Code.gs, then Deploy → Manage deployments → pencil icon → Version: <b>New version</b> → Deploy. Until then, tips stay hidden until each race starts.';
    var m=document.querySelector('main'); m.parentNode.insertBefore(w,m); }
  if(!old && w) w.remove();
  if(!UI.dayId || !D.day[UI.dayId]) UI.dayId=defaultDay();
  render();
}
function refresh(){ return api('api_getState',TOKEN,ADMIN).then(load).catch(fail); }

getParams().then(function(p){
  P=p;
  TOKEN = p.t || store('tip_token') || '';
  ADMIN = p.admin || '';
  if(p.t) store('tip_token',p.t);
  return refresh();
}).then(function(){
  if(S && !S.me && TOKEN && !S.isAdmin) toast('That link isn\'t recognised — ask the organiser for yours.');
  setInterval(function(){ if(document.visibilityState==='visible' && !busy() && UI.tab!=='admin') refresh(); }, 60000);
  setInterval(function(){ if((UI.tab==='tips'||UI.tab==='mine') && !busy()) render(); }, 30000);
});
</script>
</body>
