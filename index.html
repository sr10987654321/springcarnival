<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Carnival Tipping</title>
<style>
:root{
  /* Old-site colours on the new layout: brown, olive, green, white. Flat and square. */
  --brown:#8A4B2D; --brown-d:#74432B; --olive:#6F8A2B; --green:#9CBB49; --green-m:#8AA83C; --tan:#9B7437;
  --yellow:#F4C63D; --grey:#9A9A9A; --orange:#C4692D; --gold:#B8973A;
  --ink:#3A2B20; --muted:#6F6257; --line:#D9D2C3; --cream:#F6F1E6; --tint:#EEF4D9; --red:#C0392B;
  /* names used by older rules and inline styles */
  --bg:#FFFFFF; --card:#FFFFFF; --pear:#9CBB49; --pear-deep:#6F8A2B; --pear-soft:#EEF4D9; --leaf:#6F8A2B; --leaf-soft:#EEF4D9;
  --pink:#C4692D; --pink-soft:#FBE9DC; --butter:#F4C63D; --butter-soft:#FBF0C4; --sky:#9A9A9A; --sky-soft:#ECECEC;
  --r:0px;
}
*{box-sizing:border-box;border-radius:0 !important}
.radio,.csvg circle{border-radius:50% !important}
html,body{margin:0;background:#fff;color:var(--ink);
  font:400 16px/1.45 "Open Sans","Segoe UI",Tahoma,Verdana,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}

/* ---------- Header ---------- */
header{position:relative;background:#fff;padding:16px 18px 14px;min-height:96px;display:flex;align-items:center}
header .horse{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:150px;height:auto}
header .inner{position:relative;z-index:1;padding-right:170px}
header .tag{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--olive);margin-bottom:2px}
header h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;color:var(--brown)}
header .who{font-size:14px;color:var(--muted);margin-top:3px}

/* ---------- Tabs: one brown bar ---------- */
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;background:var(--brown)}
nav button{background:none;border:0;color:#fff;padding:14px 22px;font:inherit;font-size:18px;white-space:nowrap;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:var(--olive)}
main{max-width:none;margin:0;padding:14px 16px 100px}

/* ---------- Chips & segments ---------- */
.chips{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:#fff;padding:8px 14px;font:inherit;font-size:15px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.chip small{opacity:.8;margin-left:5px}
.seg{display:inline-flex;gap:0;margin-bottom:12px;border:1px solid var(--line)}
.seg button{border:0;background:#fff;padding:8px 18px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--olive);color:#fff}

/* ---------- Cards ---------- */
.card{background:#fff;border:1px solid var(--line);padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 3px;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px}
.rno{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:36px;padding:0 8px;font-weight:700;font-size:15px}
.c0,.c1,.c2,.c3,.c4{background:var(--olive);color:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:14px}
.meta{margin:2px 0 0 52px}
h2{font-size:20px;font-weight:700;color:var(--brown);margin:24px 0 8px}
.note{margin:0 2px 8px}

/* ---------- Pills ---------- */
.pill{font-size:12px;font-weight:700;padding:4px 9px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.pill.open{background:var(--olive);color:#fff}
.pill.closed{background:#E4E0D8;color:var(--muted)}
.pill.result{background:var(--yellow);color:var(--ink)}

/* ---------- Inputs ---------- */
select,input,textarea{font:inherit;border:1px solid #B9AF9C;padding:9px 10px;background:#fff;color:var(--ink);max-width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px #E3EDC4}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--brown);margin:12px 0 4px}
code{font-size:12px;background:var(--cream);padding:1px 4px}

/* ---------- Buttons ---------- */
.btn{background:var(--olive);color:#fff;border:0;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.gold{background:var(--brown)}
.btn.ghost{background:#fff;color:var(--olive);border:1px solid var(--olive)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #E0B4AE}
.btn:disabled{opacity:.4;cursor:default}
.lnk{color:var(--olive);font-weight:700;background:none;border:0;padding:0;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}

/* ---------- Save bar ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--brown);color:#fff}
.savebar .muted{color:#fff;font-weight:700;font-size:15px}
.savebar .btn{flex:0 0 auto;background:var(--olive)}

/* ---------- Tips & results ---------- */
.yourtip{margin-top:10px;padding:10px 12px;background:var(--cream);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pts{font-weight:700;color:#fff;background:var(--olive);padding:3px 9px}
.zero{color:var(--muted);font-weight:600}
.warn{margin-top:8px;color:var(--red);font-weight:700;font-size:14px}
.res{font-size:14px;margin-top:8px;color:var(--muted);line-height:1.8}
.res b{color:var(--ink)}
.plc-1{background:var(--yellow);color:var(--ink);padding:1px 6px;font-weight:700}
.pos{display:inline-block;min-width:40px;font-weight:700;font-size:13px}
.scr{text-decoration:line-through;color:var(--muted)}

/* ---------- Totals tiles ---------- */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.stat{padding:12px 8px;text-align:center;color:#fff}
.stat .lbl{font-size:13px}
.stat .big{font-size:26px;font-weight:700;margin:1px 0}
.stat .sub{font-size:13px}
.s-pink{background:var(--olive)}
.s-lilac{background:var(--brown)}
.s-lilac .big{color:#fff}
.s-butter{background:var(--green-m)}
.hero.sm{gap:4px;margin-bottom:10px}.hero.sm .stat{padding:9px 6px}.hero.sm .big{font-size:22px}.hero.sm .lbl,.hero.sm .sub{font-size:12px}

/* ---------- Tables: green rows, white gaps ---------- */
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table{border-collapse:separate;border-spacing:3px;width:calc(100% + 6px);margin:0 -3px;font-size:16px}
th,td{padding:10px 14px;text-align:left;white-space:nowrap}
th{background:var(--olive);color:#fff;font-weight:400;font-size:15px;position:sticky;top:0}
td{background:var(--green);color:#fff}
th.sort{cursor:pointer}
td.num,th.num{text-align:right}
td .muted,td .zero,td .cell-p{color:#F2F7E0}
td .pts{background:none;padding:0;color:#fff}
table:not(.gtable) tr.me td{background:var(--brown)}
tr.click{cursor:pointer}
tr.click:hover td{filter:brightness(1.06)}
tfoot td{background:var(--olive);font-weight:700}
.rank{display:inline-flex;min-width:26px;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.r1,.r2,.r3{padding:1px 6px}
.r1{background:var(--yellow);color:var(--ink)}.r2{background:var(--grey)}.r3{background:var(--orange)}
td.daywin{background:var(--gold);font-weight:700}
.cell-h{font-size:14px;font-weight:700}
.cell-p{font-size:13px;margin-top:2px}
td.hit{background:var(--yellow);color:var(--ink)}
td.hit .pts,td.hit .cell-p{color:var(--ink)}
.bar{height:7px;background:#E6E0D2;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--olive)}
td .btn.ghost,td .btn.danger{background:#fff}

/* ---------- Admin bits ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{background:var(--cream);border:1px solid var(--line);padding:6px 10px;font-size:14px;cursor:pointer}
.checks input{accent-color:var(--olive)}
.plc{display:grid;grid-template-columns:62px 1fr 80px 80px;gap:6px;align-items:center;margin-bottom:6px}
.plc input,.plc select{width:100%;padding:8px}
.autost{margin:10px 0 2px;font-weight:700;font-size:15px;padding:8px 12px}
.autost.on{background:var(--tint);color:#3F5413}
.autost.off{background:#F8E0DC;color:#8E1D2C}
.oldwarn{margin:14px 16px 0 !important;width:auto;background:#F8E0DC;color:#8E1D2C;padding:12px 14px;font-size:14px;line-height:1.45}

/* ---------- Toast / modal / empty ---------- */
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 18px;
  font-size:15px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:40;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(40,28,20,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:640px;width:100%}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--cream)}
.loading{text-align:center;padding:60px 10px;color:var(--muted)}

/* ---------- Runner rows & saddlecloths ---------- */
.runners{padding:0 12px}
.runner{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #E9E3D6}
.runner:last-child{border-bottom:0}
.runner.is-scr{opacity:.55}
.rnum{flex:0 0 36px;height:38px;background:#fff;color:var(--ink);border:2px solid var(--brown);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;box-shadow:inset 0 5px 0 var(--green)}
.cloth{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;margin-right:6px;background:#fff;border:1.5px solid var(--brown);
  box-shadow:inset 0 3px 0 var(--green);font-weight:700;font-size:13px;color:var(--ink);vertical-align:middle;line-height:1}
td .cloth,th .cloth{border-color:#fff}
.rmain{flex:1;min-width:0}
.rname{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:28px}
.rres{display:flex;align-items:center;gap:8px;margin-top:3px}
.rpos{font-weight:700;font-size:13px;padding:2px 8px;background:var(--grey);color:#fff}
.rpos.p1{background:var(--yellow);color:var(--ink)}.rpos.p3{background:var(--orange)}
.rwho{font-size:13px;margin-top:3px}
.rcount{flex:0 0 auto;text-align:center;min-width:38px;padding-top:2px}
.rcount b{display:block;font-size:20px;font-weight:700;color:var(--olive);line-height:1}
.rcount span{font-size:11px;text-transform:uppercase;color:var(--muted)}

/* ---------- Scoreboard grid ---------- */
.gtools{margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:0 2px 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.lg.p1{background:var(--yellow)}.lg.p2{background:var(--grey)}.lg.p3{background:var(--orange)}
.lg.sx{background:var(--green);color:#fff}
.gwrap{overflow:auto;max-height:calc(100vh - 70px);margin-bottom:12px;-webkit-overflow-scrolling:touch}
.gtable{border-collapse:separate;border-spacing:3px;width:max-content;min-width:100%;margin:0;font-size:15px}
.gtable th,.gtable td{padding:0;white-space:nowrap}
.gtable thead th{position:sticky;top:0;z-index:3;background:var(--olive);color:#fff;font-size:14px;box-shadow:0 -3px 0 #fff}
.gtable thead th.gname{z-index:4;left:0;text-align:left;padding:10px 12px;font-weight:700;color:#fff;width:200px;min-width:200px;max-width:200px;box-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 -3px 0 #fff}
.gtot-h{float:right;font-weight:400;font-size:13px}
.grace{min-width:70px;text-align:center;padding:7px 4px !important}
.grno{font-weight:700;font-size:16px;color:#fff}
.gsub{font-size:12px;color:#fff;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:3px;min-height:22px}
.gsub .cloth{margin-right:1px;height:20px;min-width:20px;font-size:11px}
tbody th.gname{position:sticky;left:0;z-index:2;background:var(--brown-d);color:#fff;text-align:left;font-weight:400;cursor:pointer;
  width:200px;min-width:200px;max-width:200px;padding:0;box-shadow:3px 0 0 #fff,-3px 0 0 #fff}
.gn{display:flex;align-items:center;gap:8px;padding:7px 10px}
.gn .rank{min-width:24px;font-size:14px;flex:0 0 auto}
.gn .r1,.gn .r2,.gn .r3{padding:1px 4px}
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;line-height:1.2}
.gtot{font-weight:700;font-size:14px;color:#F6E7A8}
.pinmark{font-size:11px}
tr.pinned th.gname{background:var(--brown)}
tr.pinned th.gname .gnm{font-weight:700}
tr.me th.gname .gnm{text-decoration:underline}
tr.gsep td{height:5px;padding:0;background:var(--tan) !important}
.gc{background:var(--green);text-align:center;vertical-align:middle;height:52px;min-width:70px;position:relative}
.gh{font-size:22px;font-weight:700;line-height:1;color:#fff}
.gc.out .gh{color:rgba(255,255,255,.72);font-weight:400}
.gc.p1{background:var(--yellow)}.gc.p2{background:var(--grey)}.gc.p3{background:var(--orange)}
.gc.p1 .gh,.gc.p1 .gamt,.gc.p1 .gfav{color:var(--ink)}
.gamt{font-size:13px;font-weight:700;margin-top:3px;color:#fff}
.gscr{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75;font-size:16px}
.gfav{font-size:13px;font-weight:700;color:#fff}
.gc.lock{color:#fff;font-size:13px}
.gempty{color:#E3EBC9}

/* ---------- Day buttons: all visible ---------- */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
@media (min-width:700px){.days{grid-template-columns:repeat(6,1fr)}}
.dayb{border:0;background:var(--green);padding:10px 8px 9px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:#fff}
.dayb:hover{filter:brightness(1.05)}
.dayb .dn{font-size:15px;line-height:1.15;min-height:34px;display:flex;align-items:center}
.dayb .dd{font-size:12px;opacity:.95}
.dayb .ds{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;margin-top:3px;background:#fff;color:var(--olive)}
.ds.done{color:var(--muted)}
.ds.live{background:var(--orange);color:#fff}
.ds.soon{background:var(--yellow);color:var(--ink)}
.ds.up{color:var(--olive)}
.ds.locked{background:var(--brown);color:#fff}
.dayb.on{background:var(--olive)}
.dayb.on .dn{font-weight:700}

/* ---------- Tip lock notice ---------- */
.lockban{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.4;background:var(--cream);color:var(--ink)}
.lockban b{font-size:16px;display:block;margin-bottom:1px}
.lockban .lbi{font-size:20px;line-height:1.2}
.lockban.open{border-left:6px solid var(--olive)}
.lockban.shut{border-left:6px solid var(--brown)}

/* ---------- Races: one race at a time ---------- */
.rbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px;scroll-margin-top:60px}
@media (min-width:700px){.rbtns{grid-template-columns:repeat(10,1fr)}}
.rb{border:0;background:var(--green);color:#fff;padding:7px 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.rb b{font-size:16px;font-weight:400}.rb span{font-size:12px}
.rb.has{background:var(--green-m)}.rb.has b{font-weight:700}
.rb.on{background:var(--olive)}.rb.on b{font-weight:700}
.racehead{margin-bottom:8px}
.pickl{padding:0 8px}
.rr{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid #E9E3D6}
.rr:last-child{border-bottom:0}
.rr.tap{cursor:pointer}.rr.tap:hover{background:#FAF7EF}
.rr.sel{background:var(--tint);box-shadow:inset 6px 0 0 var(--olive)}
.rr.is-scr{opacity:.5}
.rr.pl1{background:var(--butter-soft)}
.rsilk{flex:0 0 38px;height:42px;display:flex;align-items:center;justify-content:center}
.rsilk .silk{width:38px;height:42px}
.rsilk img.silk{object-fit:contain}
.rr .rnum{flex:0 0 34px;height:36px}
.rbar{font-size:13px;font-weight:400;color:var(--muted)}
.rmeta{font-size:14px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:inline-flex;align-items:center;gap:3px;margin-top:4px}
.flbl{font-size:12px;color:var(--muted);margin-right:3px}
.form i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;font-size:12px;font-weight:700}
.form .f1{background:var(--yellow);color:var(--ink)}.form .f23{background:var(--grey);color:#fff}.form .fo{background:#EDE8DC;color:var(--muted)}.form .fx{background:transparent;color:var(--muted)}
.rright{flex:0 0 auto;min-width:40px;text-align:center}
.rright b{display:block;font-size:20px;font-weight:700;color:var(--olive);line-height:1}.rright span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.radio{display:inline-flex !important;width:30px;height:30px;border:2px solid #B9AF9C;background:#fff;align-items:center;justify-content:center;font-size:16px !important;font-weight:700;color:#fff !important}
.rr.sel .radio{background:var(--olive);border-color:var(--olive)}
.rnav{display:flex;justify-content:space-between;gap:10px;margin:12px 0 30px}
.rnav .btn{padding:12px 22px;font-size:16px}

/* ---------- My tips ---------- */
.todo{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;cursor:pointer;font:inherit;background:var(--orange);color:#fff;padding:12px 16px;margin-bottom:10px}
.todo b{font-size:17px}.todo span{font-weight:700}
.mylist{padding:0 8px}
.mr{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #E9E3D6;cursor:pointer}
.mr:last-child{border-bottom:0}
.mr:hover{background:#FAF7EF}
.mr.need{background:var(--pink-soft)}
.mr.pl1{background:var(--butter-soft)}
.mmain{flex:1;min-width:0}
.mrace{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrace .muted{font-size:14px}
.mpick{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:17px;min-width:0}
.mpick b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpick.none{color:var(--orange);font-weight:700;font-size:15px}
.mr:not(.need) .mpick.none{color:var(--muted)}
.msilk .silk{width:26px;height:29px;display:block;margin-right:2px;object-fit:contain}
.mright{flex:0 0 auto}
.mgo{font-weight:700;color:var(--olive);font-size:15px}
.mr.need .mgo{color:var(--orange)}

/* ---------- Charts ---------- */
.ccard{padding:14px 14px 8px}
.csub{margin:2px 0 8px}
.chart{position:relative;margin:4px -4px 0;touch-action:pan-y}
.csvg{display:block;overflow:visible;font-family:inherit}
.csvg .grid{stroke:#E9E4D8;stroke-width:1}
.csvg .ax{font-size:12px;fill:var(--muted)}
.csvg .oth{fill:none;stroke:#CFC8BA;stroke-width:1}
.csvg .elab{font-size:13px;font-weight:700;fill:var(--ink)}
.csvg .vlab{font-size:12px;font-weight:700;fill:var(--ink)}
.csvg .lead{stroke:#A39A8A;stroke-width:1;fill:none}
.csvg .xhair{stroke:#A39A8A;stroke-width:1}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink);margin-bottom:6px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{display:inline-block;width:14px;height:3px}
.tt{display:none;position:absolute;z-index:5;pointer-events:none;background:#fff;color:var(--ink);border:1px solid var(--line);padding:8px 10px;font-size:13px;min-width:150px;max-width:240px}
.tt b{display:block;margin-bottom:4px}
.tt div{display:flex;align-items:center;gap:6px;white-space:nowrap}

/* ============ Time ============ */
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); }
function fmtDay(d){ if(!d) return ''; var x=new Date(d+'T12:00:00'); return x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function until(iso){
  var ms=Date.parse(iso)-Date.now(); if(ms<=0) return 'jumped';
  var m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return 'jumps in '+d+'d '+(h%24)+'h';
  if(h>0) return 'jumps in '+h+'h '+(m%60)+'m';
  return 'jumps in '+m+'m';
}
function isLocked(r){ return Date.parse(r.lock||r.start) <= Date.now(); }
function started(r){ return Date.parse(r.start) <= Date.now(); }
function fmtLeft(ms){
  var m=Math.max(0,Math.floor(ms/60000)), hh=Math.floor(m/60), d=Math.floor(hh/24);
  if(d>0) return d+'d '+(hh%24)+'h'; if(hh>0) return hh+'h '+(m%60)+'m'; return m+'m';
}
function fmtWhen(iso){ var x=new Date(iso); return x.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+' '+x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
/* The day's lock time = earliest race lock that day (normally the admin-set lock time) */
function dayLock(dayId){
  var rs=D.byDay[dayId]||[]; if(!rs.length) return null;
  return new Date(Math.min.apply(null,rs.map(function(r){return Date.parse(r.lock||r.start);}))).toISOString();
}

/* ============ Derived data & scoring ============ */
function derive(){
  D.race={}; D.day={}; D.res={}; D.byDay={}; D.tip={}; D.player={};
  S.players.forEach(function(p){ D.player[p.id]=p; });
  S.days.forEach(function(d){ D.day[d.id]=d; D.byDay[d.id]=[]; });
  S.races.forEach(function(r){ D.race[r.id]=r; (D.byDay[r.dayId]=D.byDay[r.dayId]||[]).push(r); });
  Object.keys(D.byDay).forEach(function(k){ D.byDay[k].sort(function(a,b){return a.raceNo-b.raceNo;}); });
  S.results.forEach(function(x){ D.res[x.raceId]=x; });
  S.tips.forEach(function(t){ (D.tip[t.p]=D.tip[t.p]||{})[t.r]=String(t.h); });
}
function hasResult(raceId){ var x=D.res[raceId]; return !!(x && x.placings && x.placings.length); }
function effHorse(raceId,h){
  var x=D.res[raceId]; if(!x||!h) return h;
  if((x.scratched||[]).map(String).indexOf(String(h))>=0 && x.favourite) return String(x.favourite);
  return String(h);
}
function points(pid,raceId){
  if(!hasResult(raceId)) return null;
  var h=effHorse(raceId,(D.tip[pid]||{})[raceId]); if(!h) return 0;
  var s=0; D.res[raceId].placings.forEach(function(pl){ if(String(pl.no)===h) s+=(Number(pl.win)||0)+(Number(pl.place)||0); });
  return Math.round(s*100)/100;
}
function dayTotal(pid,dayId){ return (D.byDay[dayId]||[]).reduce(function(s,r){ return s+(points(pid,r.id)||0); },0); }
function carnivalTotal(pid){ return S.days.reduce(function(s,d){ return s+dayTotal(pid,d.id); },0); }
function ranked(list,key){
  var arr=list.slice().sort(function(a,b){ return b[key]-a[key] || a.name.localeCompare(b.name); });
  arr.forEach(function(x,i){ x.rank = (i>0 && Math.abs(arr[i-1][key]-x[key])<0.001) ? arr[i-1].rank : i+1; });
  return arr;
}
function horseName(race,no){
  if(!no) return '';
  var r=(race.runners||[]).find(function(x){return String(x.no)===String(no);});
  return r ? r.name : '#'+no;
}
function placingOf(raceId,no){
  var x=D.res[raceId]; if(!x) return null;
  var p=(x.placings||[]).find(function(pl){ return String(pl.no)===String(no); });
  return p || null;
}
function cloth(no){ return '<span class="cloth">'+esc(no)+'</span>'; }
function rno(r){ return '<span class="rno c'+((r.raceNo-1)%5)+'">R'+r.raceNo+'</span>'; }
function ordinal(n){ return ['','1st','2nd','3rd'][n] || (n+'th'); }
function defaultDay(){
  if(!S.days.length) return null;
  // 1) a day being raced now, 2) the next day still open for tips, 3) the most recent day with results
  var live=S.days.filter(function(d){ var rs=D.byDay[d.id]||[]; return rs.some(started) && !rs.every(function(r){return hasResult(r.id);}); })[0];
  if(live) return live.id;
  var open=S.days.filter(function(d){ var rs=D.byDay[d.id]||[]; return rs.length && !rs.some(isLocked); })[0];
  if(open) return open.id;
  var withRes=S.days.filter(function(d){ return (D.byDay[d.id]||[]).some(function(r){return hasResult(r.id);}); });
  return (withRes.length ? withRes[withRes.length-1] : S.days[0]).id;

function dayStatus(d){
  var rs=D.byDay[d.id]||[];
  if(!rs.length) return {k:'up',t:'Upcoming'};
  if(rs.every(function(r){return hasResult(r.id);})) return {k:'done',t:'Done ✓'};
  if(rs.some(started)) return {k:'live',t:'● Live'};
  if(rs.some(isLocked)) return {k:'locked',t:'🔒 Locked'};
  var next=S.days.filter(function(x){ var r2=D.byDay[x.id]||[]; return r2.length && !r2.some(isLocked); })[0];
  return (next && next.id===d.id) ? {k:'soon',t:'Tips open'} : {k:'up',t:'Upcoming'};
}
function dayChips(){
  if(!S.days.length) return '';

/* ============ My tips ============ */
/* ---------- Silks: draw racing colours from a description like "Royal Blue, White Hoops, Red Sleeves, Yellow Cap" ---------- */
var SILK_COLS={'royal blue':'#2446B8','navy blue':'#1B2A55','navy':'#1B2A55','dark blue':'#1B2A55','light blue':'#8EC9EE','sky blue':'#8ED4F5','pale blue':'#BFE3F7','blue':'#2E6FD8',
 'emerald green':'#0F8A4B','dark green':'#15502C','lime green':'#9BD13B','lime':'#9BD13B','green':'#2E9E4F','black':'#1A1A1A','white':'#FFFFFF','red':'#D8262E','scarlet':'#E0301E','crimson':'#B3122E',
 'maroon':'#6E1426','cerise':'#DE3163','pink':'#F58BB7','hot pink':'#FF4F9A','purple':'#6A2C91','mauve':'#B784A7','violet':'#7B3FB0','lilac':'#C8A2C8','yellow':'#FFD91F','lemon':'#FFF36B',
 'gold':'#D4A017','orange':'#FF8A1F','tangerine':'#FF9933','brown':'#6B4226','beige':'#E6D3B3','fawn':'#D2B48C','grey':'#9AA0A6','gray':'#9AA0A6','silver':'#C0C6CC','aqua':'#35C6D6','turquoise':'#30C4C0'};
var SILK_KEYS=Object.keys(SILK_COLS).sort(function(a,b){return b.length-a.length;});
var PATS=['cross belts','crossbelts','armbands','armlets','epaulettes','quartered','quarters','diamonds','diamond','chevrons','chevron','checks','check','stripes','stripe','hoops','hoop','spots','spot','stars','star','sash','halved','band','seams','braces'];
function silkCols(seg){ var s=seg.toLowerCase(), out=[]; var i=0;
  while(i<s.length){ var hit=null; for(var k=0;k<SILK_KEYS.length;k++){ if(s.substr(i,SILK_KEYS[k].length)===SILK_KEYS[k]){ hit=SILK_KEYS[k]; break; } }
    if(hit && (i===0||/\W/.test(s[i-1]))){ out.push(SILK_COLS[hit]); i+=hit.length; } else i++; }
  return out; }
function parseSilks(desc){
  var o={base:'#fff',pat:null,pc:null,sleeves:null,sp:null,spc:null,cap:null};
  String(desc||'').split(/[,;]/).forEach(function(seg,idx){
    var s=seg.toLowerCase().trim(); if(!s) return; var cols=silkCols(s);
    var pat=null; for(var k=0;k<PATS.length;k++){ if(s.indexOf(PATS[k])>=0){ pat=PATS[k]; break; } }
    if(/sleeve/.test(s)){ o.sleeves=cols[0]||o.sleeves; if(pat){ o.sp=pat; o.spc=cols[1]||cols[0]; } return; }
    if(/cap/.test(s)){ o.cap=cols[0]||o.cap; return; }
    if(idx===0){ o.base=cols[0]||o.base; if(pat){ o.pat=pat; o.pc=cols[1]||cols[0]; } return; }
    if(pat){ o.pat=pat; o.pc=cols[0]||o.pc; }
  });
  return o;
}
var silkN=0;
function silksSVG(desc){
  if(!desc) return '';
  var o=parseSilks(desc), id='sk'+(silkN++), b=o.base, c=o.pc||'#fff', p=(o.pat||'').replace(/s$/,'');
  var shirt='M25 12L33 8Q40 14 47 8L55 12L76 27L67 42L57 35L57 72L23 72L23 35L13 42L4 27Z';
  var body='';
  switch(p){
    case 'hoop': for(var y=16;y<76;y+=14) body+='<rect x="0" y="'+y+'" width="80" height="7" fill="'+c+'"/>'; break;
    case 'band': body='<rect x="0" y="40" width="80" height="12" fill="'+c+'"/>'; break;
    case 'stripe': for(var x=26;x<58;x+=9) body+='<rect x="'+x+'" y="0" width="4.5" height="76" fill="'+c+'"/>'; break;
    case 'diamond': body='<pattern id="'+id+'d" width="11" height="14" patternUnits="userSpaceOnUse"><path d="M5.5 0L11 7L5.5 14L0 7Z" fill="'+c+'"/></pattern><rect x="23" width="34" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'spot': body='<pattern id="'+id+'d" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.6" fill="'+c+'"/></pattern><rect width="80" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'check': body='<pattern id="'+id+'d" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="'+c+'"/><rect x="8" y="8" width="8" height="8" fill="'+c+'"/></pattern><rect width="80" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'sash': body='<path d="M28 10L38 10L60 70L50 74Z" fill="'+c+'"/>'; break;
    case 'cross belt': case 'crossbelt': body='<path d="M26 10L34 10L58 70L50 74Z M54 10L46 10L22 70L30 74Z" fill="'+c+'"/>'; break;
    case 'chevron': for(var y2=24;y2<72;y2+=14) body+='<path d="M23 '+y2+'L40 '+(y2+10)+'L57 '+y2+'" stroke="'+c+'" stroke-width="5" fill="none"/>'; break;
    case 'star': body=[[33,30],[47,40],[35,54],[48,64]].map(function(q){ return '<path transform="translate('+q[0]+' '+q[1]+') scale(.9)" d="M0-6L1.8-1.9L6.3-1.9L2.7 0.9L4 5.4L0 2.7L-4 5.4L-2.7 0.9L-6.3-1.9L-1.8-1.9Z" fill="'+c+'"/>'; }).join(''); break;
    case 'quartered': case 'quarter': body='<rect x="40" y="0" width="40" height="40" fill="'+c+'"/><rect x="0" y="40" width="40" height="40" fill="'+c+'"/>'; break;
    case 'halved': body='<rect x="40" y="0" width="40" height="76" fill="'+c+'"/>'; break;
    case 'epaulette': body='<path d="M25 12L33 8L36 16L26 20Z M55 12L47 8L44 16L54 20Z" fill="'+c+'"/>'; break;
    case 'brace': body='<rect x="29" y="0" width="5" height="76" fill="'+c+'"/><rect x="46" y="0" width="5" height="76" fill="'+c+'"/>'; break;
    case 'seam': body='<rect x="38.5" y="0" width="3" height="76" fill="'+c+'"/>'; break;
  }
  var sl=o.sleeves||null, sleeves='';

  var cap=o.cap||b;
  return '<svg class="silk" viewBox="0 -12 80 88" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+shirt+'"/></clipPath></defs>'+

    '<path d="'+shirt+'" fill="none" stroke="#15361F" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<path d="M28 4Q40 -14 52 4Z" fill="'+cap+'" stroke="#15361F" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 4L60 5" stroke="#15361F" stroke-width="3" stroke-linecap="round"/></svg>';
}

/* ---------- My tips: your whole day at a glance ---------- */
function vMine(){

/* ---------- My tips: one race at a time, tap a horse ---------- */
function curPick(r){ if(!S.me) return ''; var d=UI.draft[r.id]; return d!=null ? String(d) : String((D.tip[S.me.id]||{})[r.id]||''); }
function tipRaceFor(dayId){
  UI.tipRace=UI.tipRace||{};
  var races=D.byDay[dayId]||[], cur=UI.tipRace[dayId];
  if(cur && races.some(function(r){return r.id===cur;})) return cur;
  var pick = (S.me && races.filter(function(r){ return !isLocked(r) && !curPick(r); })[0]) ||
             races.filter(function(r){ return !hasResult(r.id); })[0] || races[0];
  return pick ? pick.id : null;
}
function vTips(){
  if(!S.days.length) return noDays();
  var races=D.byDay[UI.dayId]||[];
  var out=dayChips();
  if(!races.length) return out+'<div class="empty">No fields yet. Check back after acceptances.</div>';
  out+=lockBanner(UI.dayId);
  var rid=tipRaceFor(UI.dayId); UI.tipRace[UI.dayId]=rid;
  var r=D.race[rid], idx=races.indexOf(r);

  // race buttons: tick + your horse number
  out+='<div class="rbtns">'+races.map(function(x){
    var p=curPick(x), done=hasResult(x.id);
    return '<button class="rb'+(x.id===rid?' on':'')+(p?' has':'')+'" data-tipr="'+esc(x.id)+'"><b>R'+x.raceNo+'</b><span>'+(p?'#'+esc(p):(done?'✓':(isLocked(x)?'–':'tip')))+'</span></button>';
  }).join('')+'</div>';

  var res=D.res[r.id]||{}, scr=(res.scratched||[]).map(String), locked=isLocked(r), canPick=!!S.me && !locked;
  var mine=curPick(r), eff=effHorse(r.id,mine);
  var status = hasResult(r.id) ? '<span class="pill result">'+(res.status==='interim'?'Interim':'Official')+'</span>' :
               started(r) ? '<span class="pill closed">Jumped</span>' : locked ? '<span class="pill closed">🔒 Locked</span>' : '<span class="pill open">Open</span>';
  out+='<div class="card racehead"><div class="row"><h3>'+rno(r)+esc(r.name)+'</h3><span class="sp"></span>'+status+'</div>'+
    '<div class="muted meta">'+fmtTime(r.start)+' your time · '+r.runners.length+' runners'+(res.favourite?' · Fav #'+esc(res.favourite):'')+'</div>';
  if(hasResult(r.id)) out+='<div class="res">'+resultLine(r)+'</div>';
  if(S.me && (locked || mine)){
    var pt=points(S.me.id,r.id);
    out+='<div class="yourtip"><span class="muted">Your tip</span> <b>'+(mine? cloth(mine)+esc(horseName(r,mine)) : '<span class="muted">none</span>')+'</b>'+
      (mine && eff!==mine ? ' <span class="muted">→ scratched, runs as fav #'+esc(eff)+'</span>':'')+
      (pt!=null ? '<span class="sp"></span><span class="'+(pt>0?'pts':'zero')+'">'+(pt>0?'+'+money(pt):'$0.00')+'</span>' : '')+'</div>';
  }
  if(canPick && mine && scr.indexOf(mine)>=0) out+='<div class="warn">Your horse is scratched. Pick again, or it switches to the favourite.</div>';
  out+='</div>';

  // who tipped what (after lock)
  var visible=locked || S.isAdmin, tippers={}, nT=0;
  if(visible) S.players.forEach(function(p){ var t=(D.tip[p.id]||{})[r.id]; if(t){ var e=effHorse(r.id,t); (tippers[e]=tippers[e]||[]).push(p.name); nT++; } });

  out+=canPick?'<div class="muted note">Tap a horse to pick it. Tips save automatically.</div>':'';
  var anySilk=r.runners.some(function(x){ return x.s||x.si; });
  out+='<div class="card runners pickl">'+r.runners.map(function(hh){
    var no=String(hh.no), isScr=scr.indexOf(no)>=0, sel=(mine===no), pl=hasResult(r.id)?placingOf(r.id,no):null;
    var who=tippers[no]||[], meta=[];
    if(hh.j) meta.push('J: '+esc(hh.j)); if(hh.t) meta.push('T: '+esc(hh.t)); if(hh.w) meta.push(esc(hh.w)+'kg');
    var cls='rr'+(sel?' sel':'')+(isScr?' is-scr':'')+(canPick&&!isScr?' tap':'')+(pl?' pl'+pl.pos:'');
    return '<div class="'+cls+'"'+(canPick&&!isScr?' data-pickh="'+esc(no)+'" role="button" tabindex="0"':'')+'>'+
      (anySilk?'<div class="rsilk">'+silkFor(hh)+'</div>':'')+
      '<div class="rnum">'+esc(no)+'</div>'+
      '<div class="rmain"><div class="rname"><span class="'+(isScr?'scr':'')+'">'+esc(hh.name)+'</span>'+(hh.bar?'<span class="rbar">('+esc(hh.bar)+')</span>':'')+
        (String(res.favourite)===no?' <span class="pill result">Fav</span>':'')+(isScr?' <span class="pill closed">Scr</span>':'')+'</div>'+
        (meta.length?'<div class="rmeta">'+meta.join(' · ')+'</div>':'')+
        formPills(hh.f)+
        (pl?'<div class="rres"><span class="rpos p'+pl.pos+'">'+ordinal(pl.pos)+'</span><span class="muted">'+(pl.win?money(pl.win)+' / ':'')+money(pl.place)+'</span></div>':'')+
        (visible&&who.length?'<div class="muted rwho">'+esc(who.join(', '))+'</div>':'')+
      '</div>'+
      '<div class="rright">'+(canPick? (isScr?'':'<span class="radio">'+(sel?'✓':'')+'</span>') :
        (visible?(who.length?'<b>'+who.length+'</b><span>tips</span>':'<span class="zero">–</span>'):(sel?'<span class="radio">✓</span>':'')))+'</div>'+
    '</div>';
  }).join('')+'</div>';

  var prev=races[idx-1], next=races[idx+1];
  out+='<div class="rnav">'+(prev?'<button class="btn ghost" data-tipr="'+esc(prev.id)+'">← R'+prev.raceNo+'</button>':'<span></span>')+
    (next?'<button class="btn '+(mine||!canPick?'gold':'ghost')+'" data-tipr="'+esc(next.id)+'">R'+next.raceNo+' →</button>':'<span></span>')+'</div>';
  return out;
}
function lockBanner(dayId,onGrid){
  var l=dayLock(dayId); if(!l) return '';
  var left=Date.parse(l)-Date.now();
  if(left>0) return '<div class="lockban open"><div class="lbi">⏱</div><div><b>Tips lock '+esc(fmtWhen(l))+'</b><div>'+fmtLeft(left)+' to go. You can change your tips until then. Everyone\'s tips are revealed when they lock.</div></div></div>';
  return '<div class="lockban shut"><div class="lbi">🔒</div><div><b>Tips locked '+esc(fmtWhen(l))+'</b><div>Everyone\'s tips are in.'+(onGrid?'':' See them all on the <button class="lnk" data-tab="grid">Scoreboard</button>.')+'</div></div></div>';
}
function resultLine(r){
  var x=D.res[r.id];
  return x.placings.slice().sort(function(a,b){return a.pos-b.pos;}).map(function(pl){
    return (pl.pos===1?'<span class="plc-1">1st</span>':'<b>'+ordinal(pl.pos)+'</b>')+' '+cloth(pl.no)+esc(horseName(r,pl.no))+' '+(pl.win?money(pl.win)+' / ':'')+money(pl.place);
  }).join(' · ') + (x.status==='interim'?' <i>(interim)</i>':'');
}
function dirtyCount(){
  if(!S.me) return 0;
  return Object.keys(UI.draft).filter(function(k){ return String(UI.draft[k]) !== String((D.tip[S.me.id]||{})[k]||''); }).length;
}
function renderSaveBar(){
  var old=document.getElementById('savebar'); if(old) old.remove();
  if(!S.me || UI.tab!=='tips') return;
  var races=D.byDay[UI.dayId]||[]; if(!races.length) return;
  var n=dirtyCount(), picked=races.filter(function(r){return curPick(r);}).length;
  var st = SAVE.failed ? '<b>Not saved.</b> Check your connection.' : (SAVE.busy||n) ? 'Saving…' : '✓ Tips saved';
  var b=document.createElement('div'); b.className='savebar'; b.id='savebar';
  b.innerHTML='<span class="muted sp">'+picked+'/'+races.length+' tipped · '+st+'</span>'+
    (SAVE.failed?'<button class="btn gold" data-act="saveTips">Retry</button>':'');
  document.body.appendChild(b);
}
var SAVE={busy:false,failed:false,timer:null};
function scheduleSave(){ SAVE.failed=false; clearTimeout(SAVE.timer); SAVE.timer=setTimeout(doSave,800); renderSaveBar(); }
function doSave(){
  if(SAVE.busy){ SAVE.timer=setTimeout(doSave,400); return; }
  var sent={}; Object.keys(UI.draft).forEach(function(k){ if(String(UI.draft[k])!==String((D.tip[S.me.id]||{})[k]||'')) sent[k]=UI.draft[k]; });
  var keys=Object.keys(sent); if(!keys.length){ UI.draft={}; renderSaveBar(); return; }
  SAVE.busy=true; renderSaveBar();
  api('api_saveTips',TOKEN,keys.map(function(k){return {raceId:k,horseNo:sent[k]};}),ADMIN).then(function(st){
    SAVE.busy=false; SAVE.failed=false;
    keys.forEach(function(k){ if(UI.draft[k]===sent[k]) delete UI.draft[k]; });
    load(st);
    if(st.saveErrors && st.saveErrors.length){ keys.forEach(function(k){ delete UI.draft[k]; }); load(st); toast('Not saved: '+st.saveErrors.join('; ')); }
    if(dirtyCount()) scheduleSave();
  }).catch(function(e){ SAVE.busy=false; SAVE.failed=true; renderSaveBar(); fail(e); });
}
window.addEventListener('beforeunload',function(e){ if(S && S.me && (dirtyCount()||SAVE.busy)){ e.preventDefault(); e.returnValue=''; } });

      S.days.map(function(d){return '<th class="num">'+esc(d.name)+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows2.map(function(x){ return '<tr class="click '+(S.me&&x.id===S.me.id?'me':'')+'" data-cmp="'+esc(x.id)+'"><td>'+rankBadge(x.rank)+'</td><td>'+esc(x.name)+'</td><td class="num"><b>'+money(x.t)+'</b></td>'+
        S.days.map(function(d){ var w=dayWin[d.id]!=null && Math.abs(x[d.id]-dayWin[d.id])<0.001;
          return '<td class="num'+(w?' daywin':'')+'">'+(x[d.id]?money(x[d.id]):'<span class="zero">–</span>')+'</td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table></div>';

    return {name:x.name,x:x.strike,y:x.avg,total:x.total,hits:x.hits,tips:x.tips,color:me?SERIES[0]:null,label:me?'You':(top.indexOf(x.id)>=0?x.name.split(' ')[0]:'')}; });
  if(!pts.length) return '';
  return '<div class="card ccard"><h3>Safe or roughie?</h3><div class="muted csub">Right means you collect often. Up means your collects pay well. Top-right is the sweet spot.</div>'+
    (S.me?legend([{name:'You',color:SERIES[0],dot:true},{name:'Everyone else',color:'#B7C2A8',dot:true}]):'')+
    scatter({pts:pts,tip:function(p){ return '<b>'+esc(p.name)+'</b><div>Strike rate<span>'+Math.round(p.x)+'% ('+p.hits+'/'+p.tips+')</span></div><div>Avg collect<span>'+money(p.y)+'</span></div><div>Total<span>'+money(p.total)+'</span></div>'; }})+
    tableView(['Player','Strike %','Avg collect'],pts.map(function(p){ return [p.name,Math.round(p.x)+'%',money(p.y)]; }))+'</div>';
}

function vStats(){
  if(!S.days.length) return noDays();
  var out='<div class="seg"><button data-sm="carnival" class="'+(UI.statMode==='carnival'?'on':'')+'">Carnival</button><button data-sm="day" class="'+(UI.statMode==='day'?'on':'')+'">By day</button></div>';
  var races;
  if(UI.statMode==='day'){ out+=dayChips(); races=(D.byDay[UI.dayId]||[]); }
  else races=S.races.slice();
  races=races.filter(function(r){return hasResult(r.id);});
  if(!races.length) return out+'<div class="empty">Stats appear once results are in.</div>';
  var collects=[];
  var rows=S.players.map(function(p){
    var o={id:p.id,name:p.name,tips:0,wins:0,hits:0,total:0,best:0};
    races.forEach(function(r){
      var h=(D.tip[p.id]||{})[r.id]; if(!h) return;
      o.tips++;
      var pt=points(p.id,r.id)||0, pl=placingOf(r.id,effHorse(r.id,h));
      if(pl && pl.pos===1) o.wins++;
      if(pt>0){ o.hits++; o.total+=pt; o.best=Math.max(o.best,pt);
        collects.push({name:p.name,race:r,h:effHorse(r.id,h),pt:pt}); }
    });
    o.strike=o.tips?o.hits/o.tips*100:0;
    o.avg=o.hits?o.total/o.hits:0;
    return o;
  });
  out+=statCharts(races)+scatterCard(rows);
  var k=UI.statSort;
  rows.sort(function(a,b){ return k==='name' ? a.name.localeCompare(b.name) : (b[k]-a[k]); });
  var cols=[['name','Player'],['total','Total'],['hits','Collects'],['wins','Winners'],['strike','Strike %'],['avg','Avg collect'],['best','Best']];
  out+='<div class="muted note">'+races.length+' races with results. Tap a heading to sort.</div>';
  out+='<div class="tbl-wrap"><table><thead><tr>'+cols.map(function(c){return '<th class="sort '+(c[0]!=='name'?'num':'')+'" data-sort="'+c[0]+'">'+c[1]+(k===c[0]?' ▾':'')+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(x){ return '<tr class="'+(S.me&&x.id===S.me.id?'me':'')+'"><td>'+esc(x.name)+'</td><td class="num"><b>'+money(x.total)+'</b></td><td class="num">'+x.hits+'/'+x.tips+'</td><td class="num">'+x.wins+'</td><td class="num">'+x.strike.toFixed(0)+'%</td><td class="num">'+money(x.avg)+'</td><td class="num">'+money(x.best)+'</td></tr>'; }).join('')+
    '</tbody></table></div>';

  collects.sort(function(a,b){return b.pt-a.pt;});
  out+='<h2>Biggest collects</h2><div class="tbl-wrap"><table><tbody>'+collects.slice(0,8).map(function(c){
    return '<tr><td>'+esc(c.name)+'</td><td>'+esc(D.day[c.race.dayId]?D.day[c.race.dayId].name:'')+' R'+c.race.raceNo+'</td><td>'+esc(c.h)+'. '+esc(horseName(c.race,c.h))+'</td><td class="num pts">'+money(c.pt)+'</td></tr>'; }).join('')+'</tbody></table></div>';

  // Missed roughies: best-paying winners nobody (or few) tipped
  var miss=races.map(function(r){ var w=D.res[r.id].placings.find(function(p){return p.pos===1;}); if(!w) return null;
    var n=S.players.filter(function(p){return effHorse(r.id,(D.tip[p.id]||{})[r.id])===String(w.no);}).length;
    return {r:r,w:w,n:n}; }).filter(Boolean).sort(function(a,b){return b.w.win-a.w.win;}).slice(0,5);
  out+='<h2>Best-paying winners</h2><div class="tbl-wrap"><table><tbody>'+miss.map(function(m){
    return '<tr><td>'+esc(D.day[m.r.dayId]?D.day[m.r.dayId].name:'')+' R'+m.r.raceNo+'</td><td>'+esc(m.w.no)+'. '+esc(horseName(m.r,m.w.no))+'</td><td class="num">'+money(m.w.win)+'</td><td class="num muted">'+m.n+' tipped</td></tr>'; }).join('')+'</tbody></table></div>';
  return out;
}

function resultForm(r){
  var res=D.res[r.id]||{placings:[],scratched:[],favourite:'',status:'final'};
  var scr=(res.scratched||[]).map(String);
  var pl=res.placings && res.placings.length ? res.placings.slice().sort(function(a,b){return a.pos-b.pos;}) : [{pos:1},{pos:2},{pos:3}];
  if(UI.extraRows && UI.extraRows[r.id]) for(var i=0;i<UI.extraRows[r.id];i++) pl.push({pos:pl.length?pl[pl.length-1].pos:1});
  var opts=function(sel){ return '<option value=""></option>'+r.runners.map(function(h){return '<option value="'+esc(h.no)+'" '+(String(sel)===String(h.no)?'selected':'')+'>'+esc(h.no)+'. '+esc(h.name)+'</option>';}).join(''); };
  var out='<div class="card" id="resForm" data-race="'+esc(r.id)+'"><h3>'+rno(r)+esc(r.name)+'</h3><div class="muted meta">'+fmtTime(r.start)+' your time</div>';
  out+='<label class="f">Scratchings (tips on these switch to the favourite)</label><div class="checks">'+r.runners.map(function(h){
    return '<label><input type="checkbox" class="scrck" value="'+esc(h.no)+'" '+(scr.indexOf(String(h.no))>=0?'checked':'')+'> '+esc(h.no)+'</label>'; }).join('')+'</div>';
  out+='<label class="f">Starting favourite</label><select id="rFav" style="width:100%">'+opts(res.favourite)+'</select>';
  out+='<label class="f">Placings — tote dividends per $1 (enter exactly as paid, incl. dead heats)</label>'+
    '<div class="plc muted" style="font-size:11px"><span>Pos</span><span>Horse</span><span>Win $</span><span>Place $</span></div>';
  pl.forEach(function(p){
    out+='<div class="plc"><select class="pPos">'+[1,2,3,4].map(function(n){return '<option '+(Number(p.pos)===n?'selected':'')+'>'+n+'</option>';}).join('')+'</select>'+
      '<select class="pNo">'+opts(p.no)+'</select><input class="pWin" inputmode="decimal" value="'+(p.win||'')+'" placeholder="—">'+
      '<input class="pPlace" inputmode="decimal" value="'+(p.place||'')+'"></div>';
  });
  out+='<div class="row" style="margin-top:4px"><button class="btn ghost small" data-act="addRow">+ Dead-heat row</button><span class="sp"></span>'+
    '<label class="muted"><input type="checkbox" id="rInterim" '+(res.status==='interim'?'checked':'')+'> Interim</label></div>';
  out+='<div class="row" style="margin-top:10px"><button class="btn" data-act="saveResult">Save result</button><span class="sp"></span>'+
    (hasResult(r.id)||scr.length?'<button class="btn danger small" data-act="clearResult">Clear</button>':'')+'</div></div>';
  return out;
}
function showModal(title,text){
  var m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="card"><div class="row"><h3>'+esc(title)+'</h3><span class="sp"></span><button class="btn ghost small" data-close>Close</button></div>'+
    '<textarea readonly style="min-height:220px;margin-top:8px">'+esc(text)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-copy>Copy</button></div></div>';
  document.body.appendChild(m);
  var ta=m.querySelector('textarea'); ta.focus(); ta.select();
  m.addEventListener('click',function(e){
    if(e.target===m || e.target.hasAttribute('data-close')) m.remove();
    if(e.target.hasAttribute('data-copy')){ ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(x){}
      if(!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(function(){toast('Copied');},function(){toast('Select the text and copy it');}); else toast(ok?'Copied':'Select the text and copy it'); }
  });
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button,th,tr,[data-pickh],[data-gorace]'); if(!t) return;
  var d=t.dataset;
  if(d.pickh){ var rr=D.race[UI.tipRace[UI.dayId]]; if(!rr||isLocked(rr)) return;
    UI.draft[rr.id] = (curPick(rr)===d.pickh) ? '' : d.pickh; render(); scheduleSave(); return; }
  if(d.gorace){ UI.tipRace=UI.tipRace||{}; UI.tipRace[UI.dayId]=d.gorace; UI.tab='tips'; render(); window.scrollTo(0,0); var rb=document.querySelector('.rbtns'); if(rb) rb.scrollIntoView({block:'start'}); return; }
  if(d.tipr){ UI.tipRace[UI.dayId]=d.tipr; render(); var rb=document.querySelector('.rbtns'); if(rb) rb.scrollIntoView({block:'start',behavior:'smooth'}); return; }
  if(d.tab){ UI.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.day){ UI.dayId=d.day; render(); return; }
  if(d.lb){ UI.lbMode=d.lb; render(); return; }
  if(d.sm){ UI.statMode=d.sm; render(); return; }
  if(d.sort){ UI.statSort=d.sort; render(); return; }
  if(d.raceSel){ UI.raceId=d.raceSel; render(); return; }
  if(d.arace){ UI.adminRace=d.arace; render(); return; }
  if(d.cmp){ var ps=getPins(); if(ps.indexOf(d.cmp)<0) ps.push(d.cmp); setPins(ps); UI.tab='grid'; render(); window.scrollTo(0,0); return; }
  if(d.pin){ var pp=getPins(), k=pp.indexOf(d.pin); if(k>=0) pp.splice(k,1); else pp.push(d.pin); setPins(pp); render(); return; }
  if(d.gsort){ UI.gridSort=d.gsort; render(); return; }
  if(d.unpin){ setPins([]); render(); return; }
  if(d.pick){ var i=UI.compare.indexOf(d.pick);
    if(i>=0) UI.compare.splice(i,1); else { if(UI.compare.length>=6){ toast('Up to 6 players'); return; } UI.compare.push(d.pick); }
    render(); return; }
  if(d.link){ var p=D.player[d.link]; showModal(p.name+' — personal link', linkFor(p)); return; }
  if(d.reset){ if(!confirm('Give '+D.player[d.reset].name+' a new link? Their old link will stop working.')) return; admin('resetToken',{id:d.reset}); return; }
  if(d.remove){ if(!confirm('Remove '+D.player[d.remove].name+' and all their tips?')) return; admin('removePlayer',{id:d.remove}); return; }
  if(d.act) actions[d.act] && actions[d.act](t);
});

    admin('saveResult',{raceId:f.dataset.race,placings:placings,scratched:scr,favourite:fav,status:document.getElementById('rInterim').checked?'interim':'final'});
  },
  clearResult:function(){ if(!confirm('Clear this result and scratchings?')) return; admin('clearResult',{raceId:UI.adminRace}); }
};
function toLocalInput(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; var p=function(n){return ('0'+n).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function admin(action,payload,after,busyMsg){
  toast(busyMsg||'Saving…');
  api('api_admin',ADMIN,action,payload,TOKEN).then(function(st){ if(after) after(st); load(st);
    if(st.source) saveSource(st.source); else if(st.diag) showDiag(st.diag); else toast(st.fetchMsg || 'Saved ✓'); }).catch(fail);
}
function saveSource(s){
  try{ var blob=new Blob([s.html],{type:'text/html'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=s.name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast(s.status===200 ? 'Saved '+s.name : 'TABtouch returned '+s.status+'. File saved anyway.'); }
  catch(e){ showModal('Page source ('+s.status+')', s.html); }
}
function favNeeded(){   // races with a result, no favourite, and at least one tip on a scratched horse
  return S.races.filter(function(r){ var x=D.res[r.id]; if(!x || !hasResult(r.id) || x.favourite) return false;
    var scr=(x.scratched||[]).map(String); if(!scr.length) return false;
    return S.players.some(function(p){ var t=(D.tip[p.id]||{})[r.id]; return t && scr.indexOf(String(t))>=0; }); });
}
function showDiag(d){
  var ok = d.status===200 && d.parsed && d.parsed.placings && d.parsed.placings.length;
  var lines=[];
  lines.push(ok ? 'RESULT READ OK' : (d.error ? 'COULD NOT CONNECT' : d.status!==200 ? 'TABTOUCH RETURNED AN ERROR' : d.hasResultBlock ? 'PAGE FOUND, BUT NO RESULT ON IT YET' : 'PAGE FOUND, BUT NOT IN THE EXPECTED LAYOUT'));
  lines.push('');
  lines.push('Race page: '+d.url+'   (meeting code '+(d.meeting||'')+')');
  lines.push('Status: '+(d.error||d.status)+'   Size: '+(d.length||0)+' characters');
  lines.push('Result block found: '+(d.hasResultBlock?'yes':'no')+'   Placings found: '+(d.positionMarkers||0)+'   Runner numbers: '+(d.runnerNumbers||0)+(d.needsJavaScript?'   (page says it needs JavaScript)':''));
  if(d.parsed){ lines.push(''); lines.push('What would be saved:');
    d.parsed.placings.forEach(function(p){ lines.push('  '+ordinal(p.pos)+'  #'+p.no+'  win $'+p.win+'  place $'+p.place); });
    lines.push('  Favourite: '+(d.parsed.favourite?'#'+d.parsed.favourite+' (won)':'not shown on the page (TABtouch only marks it when it wins)'));
    lines.push('  Dividends official: '+(d.parsed.official?'yes':'not yet')); }
  lines.push('');
  lines.push('Runner list on the page: '+(d.starters||0)+' runners');
  if(d.starters){
    lines.push('  Favourite by lowest tote win dividend: '+(d.favByDividend?'#'+d.favByDividend:'none yet'));
    lines.push('  Scratched according to the list: '+((d.scratchedByStarters||[]).join(', ')||'none flagged'));
    if(d.field) lines.push('  Import would read: '+d.field.name+' | start '+(d.field.start||'not found')+' | first runner '+JSON.stringify(d.field.first));
    lines.push('  Field names: '+(d.starterKeys||[]).join(', '));
    lines.push('  First runner as sent: '+(d.starterSample||''));
  }
  lines.push(''); lines.push('Scratchings page: '+d.scratchUrl);
  lines.push('Status: '+(d.scratchError||d.scratchStatus)+'   Size: '+(d.scratchLength||0));
  lines.push('Scratchings read: '+(d.scratchParsed?JSON.stringify(d.scratchParsed):'meeting not found on the page'));
  lines.push(''); lines.push('----- copy everything below and send it to Claude if something is wrong -----');
  lines.push('BEFORE THE RUNNER LIST:'); lines.push(d.aroundList||'(runner list not found)'); lines.push('');
  lines.push('AFTER THE RUNNER LIST:'); lines.push(d.afterList||''); lines.push('');
  lines.push('RACE PAGE SAMPLE:'); lines.push(d.sample||''); lines.push(''); lines.push('SCRATCHINGS SAMPLE:'); lines.push(d.scratchSample||'');
  showModal('TAB connection test', lines.join('\n'));
}

/* ============ Boot ============ */
function busy(){ var a=document.activeElement; return !!document.querySelector('.modal') || SAVE.busy || (S && dirtyCount()>0) || (a && /SELECT|INPUT|TEXTAREA/.test(a.tagName)); }
function load(st){
  S=st; derive();
  var old=!(st.version>=2);
  var w=document.getElementById('oldwarn');
  if(old && !w){ w=document.createElement('div'); w.id='oldwarn'; w.className='oldwarn';
    w.innerHTML='<b>The Google script is out of date.</b> In Apps Script: paste in the latest Code.gs, then Deploy → Manage deployments → ✏️ → Version: <b>New version</b> → Deploy. Until then, tips stay hidden until each race starts.';
    var m=document.querySelector('main'); m.parentNode.insertBefore(w,m); }
  if(!old && w) w.remove();
  if(!UI.dayId || !D.day[UI.dayId]) UI.dayId=defaultDay();
  render();
}
function refresh(){ return api('api_getState',TOKEN,ADMIN).then(load).catch(fail); }

getParams().then(function(p){
  P=p;
  TOKEN = p.t || store('tip_token') || '';
  ADMIN = p.admin || '';
  if(p.t) store('tip_token',p.t);
  return refresh();
}).then(function(){
  if(S && !S.me && TOKEN && !S.isAdmin) toast('That link isn\'t recognised — ask the organiser for yours.');
  setInterval(function(){ if(document.visibilityState==='visible' && !busy() && UI.tab!=='admin') refresh(); }, 60000);
  setInterval(function(){ if((UI.tab==='tips'||UI.tab==='mine') && !busy()) render(); }, 30000);
});
</script>
</body>
