<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Carnival Tipping</title>
<style>
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --soft:#FAFAF8;
  --ink:#17201B; --ink2:#465049; --muted:#69726C; --faint:#9AA29C;
  --line:#E5E7E2; --line2:#CFD4CD;
  --brand:#1F5C3D; --brand-d:#184A31; --brand-tint:#EAF3ED; --brand-line:#BFD8C8;
  --gold:#F8E3A0; --gold-soft:#FDF6DE; --gold-ink:#5C4300; --gold-solid:#D9A520;
  --silver:#E3E7EA; --silver-ink:#39424A; --silver-solid:#98A3AC;
  --bronze:#F4D9C3; --bronze-ink:#6E3C12; --bronze-solid:#C27A45;
  --red:#B3261E; --red-bg:#FCEBE9; --amber:#8A5200; --amber-bg:#FFF4DC; --amber-line:#F0D9A4;
  --r:10px; --rs:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit}
.ico{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num,.pts,.zero,.big,.gamt,.gtot,.cell-p{font-variant-numeric:tabular-nums}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:28px;max-width:1200px;margin:0 auto;padding:0 24px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.01em;white-space:nowrap;min-width:0}
.brand svg{flex:0 0 auto;width:26px;height:26px}
.brand span{overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:2px;align-self:stretch;flex:1;min-width:0}
nav button{position:relative;background:none;border:0;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:650}
nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brand)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.02em;padding:2px 7px;border-radius:999px;background:var(--brand-tint);color:var(--brand)}
main{max-width:1200px;margin:0 auto;padding:20px 24px 110px}

/* ---------- Small controls ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:var(--rs);padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .ico{width:12px;height:12px;margin-left:4px}
.seg{display:inline-flex;margin-bottom:14px;padding:3px;background:#E9EBE6;border-radius:8px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(23,32,27,.12)}

/* ---------- Cards & text ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:17px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.rno{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 6px;border-radius:5px;
  background:#EDEFEA;color:var(--ink2);font-weight:650;font-size:12px;letter-spacing:.01em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:13.5px}
.meta{margin:2px 0 0 44px}
h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:28px 0 10px}
.note{margin:0 2px 10px}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill .ico{width:11px;height:11px}
.pill.open{background:var(--brand-tint);color:var(--brand)}
.pill.closed{background:#EDEFEA;color:var(--ink2)}
.pill.result{background:var(--gold);color:var(--gold-ink)}

/* ---------- Inputs ---------- */
select,input,textarea{font:inherit;font-size:14px;border:1px solid var(--line2);border-radius:var(--rs);padding:8px 10px;background:var(--surface);color:var(--ink);max-width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
input[type=checkbox]{accent-color:var(--brand)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 5px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#EDEFEA;padding:1px 5px;border-radius:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:var(--rs);
  padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.gold{background:var(--brand);border-color:var(--brand)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--soft);border-color:var(--faint)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{background:var(--surface);color:var(--red);border-color:var(--line2)}
.btn.danger:hover{background:var(--red-bg);border-color:#E7B5B0}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.dayb:focus-visible,.rb:focus-visible,nav button:focus-visible,.rr:focus-visible,.mr:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lnk{color:var(--brand);background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- Save bar ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(23,32,27,.06)}
.savebar .in{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;padding:11px 24px;font-size:14px}
.savebar b{font-weight:650}
.sv{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.sv.ok{color:var(--brand)}
.sv.bad{color:var(--red)}

/* ---------- Tips & results ---------- */
.yourtip{margin-top:12px;padding:10px 12px;background:var(--soft);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.pts{font-weight:650;color:var(--brand)}
.zero{color:var(--faint);font-weight:500}
.warn{margin-top:10px;color:var(--red);font-weight:600;font-size:13.5px}
.res{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin-top:10px;color:var(--ink2)}
.res .rl{display:inline-flex;align-items:center;gap:6px}
.res .rl b{color:var(--ink);font-weight:600}
.scr{text-decoration:line-through;color:var(--muted)}

/* ---------- Summary figures ---------- */
.hero{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.stat{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .big{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.stat .sub{font-size:12.5px;color:var(--muted)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{background:var(--soft);font-size:12.5px;font-weight:600;color:var(--muted)}
th.sort{cursor:pointer}
th.sort:hover,th.sort.cur{color:var(--ink)}
td.num,th.num{text-align:right}
th.dcol{white-space:normal;min-width:86px;max-width:130px;line-height:1.3;vertical-align:bottom}
td b{font-weight:650}
td.pact{text-align:right}
td.pact .btn{margin:2px 0 2px 4px}
tr.me td{background:var(--brand-tint)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.click.me:hover td{background:#E1EEE6}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.r1{background:var(--gold);color:var(--gold-ink)}
.r2{background:var(--silver);color:var(--silver-ink)}
.r3{background:var(--bronze);color:var(--bronze-ink)}
td.daywin span{display:inline-block;margin:-2px -7px;padding:2px 7px;border-radius:5px;background:var(--gold);color:var(--gold-ink);font-weight:650}
.cell-p{font-size:12.5px;margin-top:1px}

/* ---------- Admin ---------- */
.agrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
@media (max-width:999px){.agrid{display:block}}
.acol>h2:first-child{margin-top:4px}
.acol .days{grid-template-columns:repeat(3,1fr)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--rs);padding:5px 10px;font-size:13.5px;cursor:pointer}
.plc{display:grid;grid-template-columns:62px 1fr 84px 84px;gap:8px;align-items:center;margin-bottom:6px}
.plc input,.plc select{width:100%}
.plc.muted{font-size:12px;margin-bottom:4px}
.autost{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-weight:600;font-size:13.5px;padding:9px 12px;border-radius:8px}
.autost i{width:8px;height:8px;border-radius:50%;background:currentColor}
.autost.on{background:var(--brand-tint);color:var(--brand)}
.autost.off{background:var(--amber-bg);color:var(--amber)}
.oldwarn{max-width:1152px;margin:16px auto 0;background:var(--red-bg);color:#7A1A14;border:1px solid #F1C6C2;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5}
main .oldwarn{margin:0 0 12px}

/* ---------- Toast / modal / empty ---------- */
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;opacity:0;transition:all .2s;pointer-events:none;z-index:40;max-width:90%;box-shadow:0 6px 20px rgba(23,32,27,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(23,32,27,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:640px;width:100%;margin:0;box-shadow:0 20px 50px rgba(23,32,27,.25)}
.empty{text-align:center;padding:44px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r);font-size:14px}
.loading{text-align:center;padding:80px 10px;color:var(--muted);font-size:14px}

/* ---------- Race day picker: all days visible ---------- */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media (min-width:760px){.days{grid-template-columns:repeat(6,1fr)}}
.dayb{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;padding:10px 12px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dayb:hover{border-color:var(--faint)}
.dayb .dn{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dayb .dm{display:flex;flex-wrap:wrap;align-items:center;gap:1px 10px;font-size:12px;color:var(--muted);margin-top:auto}
.ds{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.ds i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ds.live{color:var(--red)}.ds.live i{background:var(--red)}
.ds.soon{color:var(--brand)}.ds.soon i{background:#2E9B62}
.ds.locked{color:var(--amber)}.ds.locked i{background:#D08A1C}
.ds.up{color:var(--muted);font-weight:500}.ds.up i{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.dayb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dayb.on .dm,.dayb.on .ds{color:rgba(255,255,255,.82)}
.dayb.on .ds i{background:#fff;box-shadow:none}

/* ---------- Tip lock notice ---------- */
.lockban{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.45;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.lockban b{color:var(--ink);font-weight:650;margin-right:6px}
.lockban .ico{margin-top:3px;width:16px;height:16px}
.lockban.open{background:var(--brand-tint);border-color:var(--brand-line)}
.lockban.open .ico{color:var(--brand)}

/* ---------- Races: one race at a time ---------- */
.rbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;scroll-margin-top:68px}
@media (min-width:760px){.rbtns{display:flex}.rb{flex:1 1 0}}
.rb{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px 5px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rb:hover{border-color:var(--faint)}
.rb b{font-size:14px;font-weight:600}
.rb span{font-size:12px;color:var(--muted);min-height:18px}
.rb.has span{color:var(--brand);font-weight:650}
.rb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rb.on span{color:rgba(255,255,255,.85)}
.racehead{margin-bottom:12px}
.racehead>.row{flex-wrap:nowrap;align-items:flex-start;gap:12px}
.racehead h3{flex:1;min-width:0;align-items:flex-start;line-height:1.3}
.racehead h3 .rno{margin-top:-1px}
.racehead .sp{display:none}
.racehead .pill{margin-top:1px}
.pickl{padding:0;overflow:hidden}
.rr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr.tap{cursor:pointer}
.rr.tap:hover{background:var(--soft)}
.rr.sel,.rr.sel.tap:hover{background:var(--brand-tint);box-shadow:inset 3px 0 0 var(--brand)}
.rr.is-scr .rsilk,.rr.is-scr .rnum,.rr.is-scr .rmain,.rr.is-scr .rmid{opacity:.5}
.rr.pl1{background:var(--gold-soft)}
.rnum{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cloth{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;margin-right:7px;border-radius:5px;border:1px solid var(--line2);background:var(--surface);
  font-weight:700;font-size:12px;color:var(--ink);vertical-align:middle;line-height:1;font-variant-numeric:tabular-nums}
.rsilk{grid-column:1;grid-row:1}
.rnum{grid-column:2;grid-row:1}
.rmain{grid-column:3;grid-row:1;min-width:0}
.pickl.ns .rr{grid-template-columns:0 auto minmax(0,1fr) auto}
.pickl.ns .rnum{margin-left:-12px}
.rname{font-weight:600;font-size:15.5px;letter-spacing:-.005em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rbar{font-size:12.5px;font-weight:400;color:var(--muted)}
.rmeta{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rwho{font-size:12.5px;margin-top:3px;white-space:normal}
.rmid{grid-column:3;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:5px;min-width:0}
.rmid:empty{display:none}
.rres{display:inline-flex;align-items:center;gap:8px}
.rpos{font-weight:650;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--silver);color:var(--silver-ink)}
.rpos.p1{background:var(--gold);color:var(--gold-ink)}
.rpos.p3{background:var(--bronze);color:var(--bronze-ink)}
.form{display:inline-flex;align-items:center;gap:2px}
.flbl{font-size:12px;color:var(--muted);margin-right:5px}
.form i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:4px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.form .f1{background:var(--gold);color:var(--gold-ink)}
.form .f23{background:var(--silver);color:var(--silver-ink)}
.form .fo{color:var(--ink2)}
.form .fx{color:var(--faint)}
.rright{grid-column:4;grid-row:1 / span 2;min-width:34px;text-align:center}
.rright b{display:block;font-size:16px;font-weight:650;line-height:1.1}
.rright span{font-size:11px;color:var(--muted)}
.radio{display:inline-flex !important;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);color:#fff !important}
.radio .ico{width:13px;height:13px;stroke-width:2.2}
.rr.tap:hover .radio{border-color:var(--brand)}
.rr.sel .radio{background:var(--brand);border-color:var(--brand)}
.rnav{display:flex;justify-content:space-between;gap:10px;margin:14px 0 30px}
.rnav .btn{padding:10px 18px}
@media (min-width:860px){
  .rr{grid-template-columns:auto auto minmax(0,1fr) 250px 48px}
  .pickl.ns .rr{grid-template-columns:0 auto minmax(0,1fr) 250px 48px}
  .rmid{grid-column:4;grid-row:1;margin-top:0}
  .rright{grid-column:5;grid-row:1}
}

/* racing colours: a 20x24 slice of the TABtouch image, scaled up */
.rsilk{width:32px;height:40px;display:flex;align-items:center;justify-content:center}
.rsilk .silk{width:32px;height:36px}
.rsilk img.silk{object-fit:contain}
.silkbox{display:inline-block;overflow:hidden;vertical-align:middle;flex:0 0 auto}
.silksp{display:block;overflow:hidden;transform-origin:top left}
.silksp img{display:block;max-width:none;width:auto;height:24px}
.msilk{display:inline-flex;align-items:center;margin-right:8px;vertical-align:middle}
.msilk .silk{width:26px;height:29px;display:block;object-fit:contain}

/* ---------- My tips ---------- */
.todo{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;cursor:pointer;text-align:left;
  background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;color:var(--amber);padding:10px 14px;margin-bottom:12px;font-size:14px}
.todo b{font-weight:650;color:#5F3900}
.todo span{display:inline-flex;align-items:center;gap:3px;font-weight:650}
.mylist{padding:0;overflow:hidden}
.mr{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mr:last-child{border-bottom:0}
.mr:hover{background:var(--soft)}
.mr.pl1{background:var(--gold-soft)}
.mmain{flex:1;min-width:0}
.mrace{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtime{display:inline-block;min-width:62px;margin-right:6px;font-variant-numeric:tabular-nums}
.mpick{display:flex;align-items:center;margin-top:3px;font-size:15.5px;min-width:0}
.mpick b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpick .muted{margin-left:8px;white-space:nowrap}
.mpick .rpos{margin-left:8px}
.mpick.none{color:var(--faint);font-size:14px}
.mr.need .mpick.none{color:var(--amber);font-weight:600}
.mright{flex:0 0 auto;text-align:right;font-size:14px}

<script>

/* ============ Time ============ */
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); }
function fmtDay(d){ if(!d) return ''; var x=new Date(d+'T12:00:00'); return x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function until(iso){
  var ms=Date.parse(iso)-Date.now(); if(ms<=0) return 'jumped';
  var m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return 'jumps in '+d+'d '+(h%24)+'h';
  if(h>0) return 'jumps in '+h+'h '+(m%60)+'m';
  return 'jumps in '+m+'m';
}
function isLocked(r){ return Date.parse(r.lock||r.start) <= Date.now(); }
function started(r){ return Date.parse(r.start) <= Date.now(); }
function fmtLeft(ms){
  var m=Math.max(0,Math.floor(ms/60000)), hh=Math.floor(m/60), d=Math.floor(hh/24);
  if(d>0) return d+'d '+(hh%24)+'h'; if(hh>0) return hh+'h '+(m%60)+'m'; return m+'m';
}
function fmtWhen(iso){ var x=new Date(iso); return x.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+' '+x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
/* The day's lock time = earliest race lock that day (normally the admin-set lock time) */
function dayLock(dayId){
  var rs=D.byDay[dayId]||[]; if(!rs.length) return null;
  return new Date(Math.min.apply(null,rs.map(function(r){return Date.parse(r.lock||r.start);}))).toISOString();
}

/* ============ Derived data & scoring ============ */
function derive(){
  D.race={}; D.day={}; D.res={}; D.byDay={}; D.tip={}; D.player={};
  S.players.forEach(function(p){ D.player[p.id]=p; });
  S.days.forEach(function(d){ D.day[d.id]=d; D.byDay[d.id]=[]; });
  S.races.forEach(function(r){ D.race[r.id]=r; (D.byDay[r.dayId]=D.byDay[r.dayId]||[]).push(r); });
  Object.keys(D.byDay).forEach(function(k){ D.byDay[k].sort(function(a,b){return a.raceNo-b.raceNo;}); });
  S.results.forEach(function(x){ D.res[x.raceId]=x; });
  S.tips.forEach(function(t){ (D.tip[t.p]=D.tip[t.p]||{})[t.r]=String(t.h); });
}
function hasResult(raceId){ var x=D.res[raceId]; return !!(x && x.placings && x.placings.length); }
function effHorse(raceId,h){
  var x=D.res[raceId]; if(!x||!h) return h;
  if((x.scratched||[]).map(String).indexOf(String(h))>=0 && x.favourite) return String(x.favourite);
  return String(h);
}
function points(pid,raceId){
  if(!hasResult(raceId)) return null;
  var h=effHorse(raceId,(D.tip[pid]||{})[raceId]); if(!h) return 0;
  var s=0; D.res[raceId].placings.forEach(function(pl){ if(String(pl.no)===h) s+=(Number(pl.win)||0)+(Number(pl.place)||0); });
  return Math.round(s*100)/100;
}
function dayTotal(pid,dayId){ return (D.byDay[dayId]||[]).reduce(function(s,r){ return s+(points(pid,r.id)||0); },0); }
function carnivalTotal(pid){ return S.days.reduce(function(s,d){ return s+dayTotal(pid,d.id); },0); }
function ranked(list,key){
  var arr=list.slice().sort(function(a,b){ return b[key]-a[key] || a.name.localeCompare(b.name); });
  arr.forEach(function(x,i){ x.rank = (i>0 && Math.abs(arr[i-1][key]-x[key])<0.001) ? arr[i-1].rank : i+1; });
  return arr;
}
function horseName(race,no){
  if(!no) return '';
  var r=(race.runners||[]).find(function(x){return String(x.no)===String(no);});
  return r ? r.name : '#'+no;
}
function placingOf(raceId,no){
  var x=D.res[raceId]; if(!x) return null;
  var p=(x.placings||[]).find(function(pl){ return String(pl.no)===String(no); });
  return p || null;
}
function cloth(no){ return '<span class="cloth">'+esc(no)+'</span>'; }
function rno(r){ return '<span class="rno">R'+r.raceNo+'</span>'; }
function ordinal(n){ return ['','1st','2nd','3rd'][n] || (n+'th'); }
function defaultDay(){
  if(!S.days.length) return null;
  // 1) a day being raced now, 2) the next day still open for tips, 3) the most recent day with results
  var live=S.days.filter(function(d){ var rs=D.byDay[d.id]||[]; return rs.some(started) && !rs.every(function(r){return hasResult(r.id);}); })[0];

  var open=S.days.filter(function(d){ var rs=D.byDay[d.id]||[]; return rs.length && !rs.some(isLocked); })[0];
  if(open) return open.id;
  var withRes=S.days.filter(function(d){ return (D.byDay[d.id]||[]).some(function(r){return hasResult(r.id);}); });
  return (withRes.length ? withRes[withRes.length-1] : S.days[0]).id;

/* ============ Shell ============ */
var TABS=[['mine','My tips'],['tips','Races'],['grid','Scoreboard'],['board','Ladder'],['stats','Stats']];

function dayStatus(d){
  var rs=D.byDay[d.id]||[];
  if(!rs.length) return {k:'up',t:'Upcoming'};
  if(rs.every(function(r){return hasResult(r.id);})) return {k:'done',t:'Done'};

}

  }).join('')+'</div>';

/* ============ My tips ============ */
/* ---------- Silks: draw racing colours from a description like "Royal Blue, White Hoops, Red Sleeves, Yellow Cap" ---------- */
var SILK_COLS={'royal blue':'#2446B8','navy blue':'#1B2A55','navy':'#1B2A55','dark blue':'#1B2A55','light blue':'#8EC9EE','sky blue':'#8ED4F5','pale blue':'#BFE3F7','blue':'#2E6FD8',
 'emerald green':'#0F8A4B','dark green':'#15502C','lime green':'#9BD13B','lime':'#9BD13B','green':'#2E9E4F','black':'#1A1A1A','white':'#FFFFFF','red':'#D8262E','scarlet':'#E0301E','crimson':'#B3122E',
 'maroon':'#6E1426','cerise':'#DE3163','pink':'#F58BB7','hot pink':'#FF4F9A','purple':'#6A2C91','mauve':'#B784A7','violet':'#7B3FB0','lilac':'#C8A2C8','yellow':'#FFD91F','lemon':'#FFF36B',
 'gold':'#D4A017','orange':'#FF8A1F','tangerine':'#FF9933','brown':'#6B4226','beige':'#E6D3B3','fawn':'#D2B48C','grey':'#9AA0A6','gray':'#9AA0A6','silver':'#C0C6CC','aqua':'#35C6D6','turquoise':'#30C4C0'};
var SILK_KEYS=Object.keys(SILK_COLS).sort(function(a,b){return b.length-a.length;});
var PATS=['cross belts','crossbelts','armbands','armlets','epaulettes','quartered','quarters','diamonds','diamond','chevrons','chevron','checks','check','stripes','stripe','hoops','hoop','spots','spot','stars','star','sash','halved','band','seams','braces'];
function silkCols(seg){ var s=seg.toLowerCase(), out=[]; var i=0;
  while(i<s.length){ var hit=null; for(var k=0;k<SILK_KEYS.length;k++){ if(s.substr(i,SILK_KEYS[k].length)===SILK_KEYS[k]){ hit=SILK_KEYS[k]; break; } }
    if(hit && (i===0||/\W/.test(s[i-1]))){ out.push(SILK_COLS[hit]); i+=hit.length; } else i++; }
  return out; }
function parseSilks(desc){
  var o={base:'#fff',pat:null,pc:null,sleeves:null,sp:null,spc:null,cap:null};
  String(desc||'').split(/[,;]/).forEach(function(seg,idx){
    var s=seg.toLowerCase().trim(); if(!s) return; var cols=silkCols(s);
    var pat=null; for(var k=0;k<PATS.length;k++){ if(s.indexOf(PATS[k])>=0){ pat=PATS[k]; break; } }
    if(/sleeve/.test(s)){ o.sleeves=cols[0]||o.sleeves; if(pat){ o.sp=pat; o.spc=cols[1]||cols[0]; } return; }
    if(/cap/.test(s)){ o.cap=cols[0]||o.cap; return; }
    if(idx===0){ o.base=cols[0]||o.base; if(pat){ o.pat=pat; o.pc=cols[1]||cols[0]; } return; }
    if(pat){ o.pat=pat; o.pc=cols[0]||o.pc; }
  });
  return o;
}
var silkN=0;
function silksSVG(desc){
  if(!desc) return '';
  var o=parseSilks(desc), id='sk'+(silkN++), b=o.base, c=o.pc||'#fff', p=(o.pat||'').replace(/s$/,'');
  var shirt='M25 12L33 8Q40 14 47 8L55 12L76 27L67 42L57 35L57 72L23 72L23 35L13 42L4 27Z';
  var body='';
  switch(p){
    case 'hoop': for(var y=16;y<76;y+=14) body+='<rect x="0" y="'+y+'" width="80" height="7" fill="'+c+'"/>'; break;
    case 'band': body='<rect x="0" y="40" width="80" height="12" fill="'+c+'"/>'; break;
    case 'stripe': for(var x=26;x<58;x+=9) body+='<rect x="'+x+'" y="0" width="4.5" height="76" fill="'+c+'"/>'; break;
    case 'diamond': body='<pattern id="'+id+'d" width="11" height="14" patternUnits="userSpaceOnUse"><path d="M5.5 0L11 7L5.5 14L0 7Z" fill="'+c+'"/></pattern><rect x="23" width="34" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'spot': body='<pattern id="'+id+'d" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.6" fill="'+c+'"/></pattern><rect width="80" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'check': body='<pattern id="'+id+'d" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="'+c+'"/><rect x="8" y="8" width="8" height="8" fill="'+c+'"/></pattern><rect width="80" height="76" fill="url(#'+id+'d)"/>'; break;
    case 'sash': body='<path d="M28 10L38 10L60 70L50 74Z" fill="'+c+'"/>'; break;
    case 'cross belt': case 'crossbelt': body='<path d="M26 10L34 10L58 70L50 74Z M54 10L46 10L22 70L30 74Z" fill="'+c+'"/>'; break;
    case 'chevron': for(var y2=24;y2<72;y2+=14) body+='<path d="M23 '+y2+'L40 '+(y2+10)+'L57 '+y2+'" stroke="'+c+'" stroke-width="5" fill="none"/>'; break;
    case 'star': body=[[33,30],[47,40],[35,54],[48,64]].map(function(q){ return '<path transform="translate('+q[0]+' '+q[1]+') scale(.9)" d="M0-6L1.8-1.9L6.3-1.9L2.7 0.9L4 5.4L0 2.7L-4 5.4L-2.7 0.9L-6.3-1.9L-1.8-1.9Z" fill="'+c+'"/>'; }).join(''); break;
    case 'quartered': case 'quarter': body='<rect x="40" y="0" width="40" height="40" fill="'+c+'"/><rect x="0" y="40" width="40" height="40" fill="'+c+'"/>'; break;
    case 'halved': body='<rect x="40" y="0" width="40" height="76" fill="'+c+'"/>'; break;
    case 'epaulette': body='<path d="M25 12L33 8L36 16L26 20Z M55 12L47 8L44 16L54 20Z" fill="'+c+'"/>'; break;
    case 'brace': body='<rect x="29" y="0" width="5" height="76" fill="'+c+'"/><rect x="46" y="0" width="5" height="76" fill="'+c+'"/>'; break;
    case 'seam': body='<rect x="38.5" y="0" width="3" height="76" fill="'+c+'"/>'; break;
  }
  var sl=o.sleeves||null, sleeves='';
  if(sl) sleeves='<path d="M25 12L4 27L13 42L23 35Z M55 12L76 27L67 42L57 35Z" fill="'+sl+'"/>';
  if(o.sp && /arm|hoop|band/.test(o.sp)) sleeves+='<path d="M9 23L18 38M14 19L22 32 M71 23L62 38M66 19L58 32" stroke="'+(o.spc||'#fff')+'" stroke-width="4"/>';
  var cap=o.cap||b;
  return '<svg class="silk" viewBox="0 -12 80 88" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+shirt+'"/></clipPath></defs>'+
    '<g clip-path="url(#'+id+')"><rect x="0" y="0" width="80" height="76" fill="'+b+'"/>'+body+sleeves+'</g>'+
    '<path d="'+shirt+'" fill="none" stroke="#15361F" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<path d="M28 4Q40 -14 52 4Z" fill="'+cap+'" stroke="#15361F" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 4L60 5" stroke="#15361F" stroke-width="3" stroke-linecap="round"/></svg>';
}
/* Racing colours: TABtouch has one image per race at a fixed link,
   https://www.tabtouch.com.au/misc/silkspriteimage/<date>/<meeting>/<race>
   with the silks in a row in runner order. Each silk is 20px wide and 24px high. */
var SILK_W=20, SILK_H=24;
function silkFor(r,raceId,size){
  size=size||38;
  if(r.si && r.sx!=null && r.sx!==''){
    var url=String(r.si).replace(/\/(true|false)$/,''), sc=size/SILK_W;
    return '<span class="silkbox" style="width:'+size+'px;height:'+Math.round(SILK_H*sc)+'px"><span class="silksp" style="width:'+SILK_W+'px;height:'+SILK_H+'px;transform:scale('+sc.toFixed(3)+')">'+
      '<img src="'+esc(url)+'" style="margin-left:-'+(SILK_W*Number(r.sx))+'px" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.parentNode.style.visibility=\'hidden\'"></span></span>';
  }
  return r.si ? '<img class="silk" src="'+esc(r.si)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : silksSVG(r.s);
}
function formPills(f){
  if(!f) return '';
  return '<span class="form"><span class="flbl">Form</span>'+String(f).split('').map(function(ch){
    var k= ch==='1'?'f1':(ch==='2'||ch==='3')?'f23':(ch.toLowerCase()==='x')?'fx':'fo';
    return '<i class="'+k+'">'+esc(ch.toLowerCase()==='x'?'x':ch)+'</i>';
  }).join('')+'</span>';
}

/* ---------- My tips: one race at a time, tap a horse ---------- */
function curPick(r){ if(!S.me) return ''; var d=UI.draft[r.id]; return d!=null ? String(d) : String((D.tip[S.me.id]||{})[r.id]||''); }
function tipRaceFor(dayId){
  UI.tipRace=UI.tipRace||{};
  var races=D.byDay[dayId]||[], cur=UI.tipRace[dayId];
  if(cur && races.some(function(r){return r.id===cur;})) return cur;
  var pick = (S.me && races.filter(function(r){ return !isLocked(r) && !curPick(r); })[0]) ||
             races.filter(function(r){ return !hasResult(r.id); })[0] || races[0];
  return pick ? pick.id : null;
}
function vTips(){
  if(!S.days.length) return noDays();
  var races=D.byDay[UI.dayId]||[];
  var out=dayChips();
  if(!races.length) return out+'<div class="empty">No fields yet. Check back after acceptances.</div>';
  out+=lockBanner(UI.dayId);
  var rid=tipRaceFor(UI.dayId); UI.tipRace[UI.dayId]=rid;
  var r=D.race[rid], idx=races.indexOf(r);

  // race buttons: tick + your horse number
  out+='<div class="rbtns">'+races.map(function(x){
    var p=curPick(x), done=hasResult(x.id);
    return '<button class="rb'+(x.id===rid?' on':'')+(p?' has':'')+'" data-tipr="'+esc(x.id)+'"><b>R'+x.raceNo+'</b><span>'+(p?'#'+esc(p):((S.me&&!isLocked(x)&&!done)?'Tip':'–'))+'</span></button>';
  }).join('')+'</div>';

  var res=D.res[r.id]||{}, scr=(res.scratched||[]).map(String), locked=isLocked(r), canPick=!!S.me && !locked;
  var mine=curPick(r), eff=effHorse(r.id,mine);
  var status = hasResult(r.id) ? '<span class="pill result">'+(res.status==='interim'?'Interim result':'Result')+'</span>' :

  out+='<div class="card racehead"><div class="row"><h3>'+rno(r)+esc(r.name)+'</h3><span class="sp"></span>'+status+'</div>'+
    '<div class="muted meta">'+fmtTime(r.start)+' your time · '+r.runners.length+' runners'+(res.favourite?' · Fav #'+esc(res.favourite):'')+'</div>';
  if(hasResult(r.id)) out+='<div class="res">'+resultLine(r)+'</div>';
  if(S.me && (locked || mine)){
    var pt=points(S.me.id,r.id);
    out+='<div class="yourtip"><span class="muted">Your tip</span> <b>'+(mine? cloth(mine)+esc(horseName(r,mine)) : '<span class="muted">none</span>')+'</b>'+
      (mine && eff!==mine ? ' <span class="muted">→ scratched, runs as fav #'+esc(eff)+'</span>':'')+
      (pt!=null ? '<span class="sp"></span><span class="'+(pt>0?'pts':'zero')+'">'+(pt>0?'+'+money(pt):'$0.00')+'</span>' : '')+'</div>';
  }
  if(canPick && mine && scr.indexOf(mine)>=0) out+='<div class="warn">Your horse is scratched. Pick again, or it switches to the favourite.</div>';
  out+='</div>';

  // who tipped what (after lock)
  var visible=locked || S.isAdmin, tippers={}, nT=0;
  if(visible) S.players.forEach(function(p){ var t=(D.tip[p.id]||{})[r.id]; if(t){ var e=effHorse(r.id,t); (tippers[e]=tippers[e]||[]).push(p.name); nT++; } });

  out+=canPick?'<div class="muted note">Tap a horse to pick it. Tips save automatically.</div>':'';
  var anySilk=r.runners.some(function(x){ return x.s||x.si; });
  out+='<div class="card pickl'+(anySilk?'':' ns')+'">'+r.runners.map(function(hh){
    var no=String(hh.no), isScr=scr.indexOf(no)>=0, sel=(mine===no), pl=hasResult(r.id)?placingOf(r.id,no):null;
    var who=tippers[no]||[], meta=[];
    if(hh.j) meta.push('J: '+esc(hh.j)); if(hh.t) meta.push('T: '+esc(hh.t)); if(hh.w) meta.push(esc(hh.w)+'kg');
    var cls='rr'+(sel?' sel':'')+(isScr?' is-scr':'')+(canPick&&!isScr?' tap':'')+(pl?' pl'+pl.pos:'');
    return '<div class="'+cls+'"'+(canPick&&!isScr?' data-pickh="'+esc(no)+'" role="button" tabindex="0"':'')+'>'+
      (anySilk?'<div class="rsilk">'+silkFor(hh,r.id,32)+'</div>':'')+
      '<div class="rnum">'+esc(no)+'</div>'+
      '<div class="rmain"><div class="rname"><span class="'+(isScr?'scr':'')+'">'+esc(hh.name)+'</span>'+(hh.bar?'<span class="rbar">('+esc(hh.bar)+')</span>':'')+
        (String(res.favourite)===no?'<span class="pill result">Fav</span>':'')+(isScr?'<span class="pill closed">Scratched</span>':'')+'</div>'+
        (meta.length?'<div class="rmeta">'+meta.join(' · ')+'</div>':'')+
        (visible&&who.length?'<div class="muted rwho">'+esc(who.join(', '))+'</div>':'')+
      '</div>'+
      '<div class="rmid">'+
        (pl?'<span class="rres"><span class="rpos p'+pl.pos+'">'+ordinal(pl.pos)+'</span><span class="muted num">'+(pl.win?money(pl.win)+' / ':'')+money(pl.place)+'</span></span>':'')+
        formPills(hh.f)+'</div>'+
      '<div class="rright">'+(canPick? (isScr?'':'<span class="radio">'+(sel?ico('check'):'')+'</span>') :
        (visible?(who.length?'<b>'+who.length+'</b><span>'+(who.length===1?'tip':'tips')+'</span>':'<span class="zero">–</span>'):(sel?'<span class="radio">'+ico('check')+'</span>':'')))+'</div>'+
    '</div>';
  }).join('')+'</div>';

  var prev=races[idx-1], next=races[idx+1];
  out+='<div class="rnav">'+(prev?'<button class="btn ghost" data-tipr="'+esc(prev.id)+'">'+ico('prev')+'Race '+prev.raceNo+'</button>':'<span></span>')+
    (next?'<button class="btn '+(mine||!canPick?'gold':'ghost')+'" data-tipr="'+esc(next.id)+'">Race '+next.raceNo+ico('next')+'</button>':'<span></span>')+'</div>';
  return out;
}
function lockBanner(dayId,onGrid){
  var l=dayLock(dayId); if(!l) return '';
  var left=Date.parse(l)-Date.now();
  if(left>0) return '<div class="lockban open">'+ico('clock')+'<div><b>Tips lock '+esc(fmtWhen(l))+'</b>'+fmtLeft(left)+' to go. '+(onGrid?'Everyone\'s tips show here once they lock.':'You can change your tips until then.')+'</div></div>';
  return '<div class="lockban shut">'+ico('lock')+'<div><b>Tips locked '+esc(fmtWhen(l))+'</b>Everyone\'s tips are in.'+(onGrid?'':' See them all on the <button class="lnk" data-tab="grid">Scoreboard</button>.')+'</div></div>';
}
function resultLine(r){
  var x=D.res[r.id];
  return x.placings.slice().sort(function(a,b){return a.pos-b.pos;}).map(function(pl){
    return '<span class="rl"><span class="rpos p'+pl.pos+'">'+ordinal(pl.pos)+'</span><b>'+cloth(pl.no)+esc(horseName(r,pl.no))+'</b><span class="num">'+(pl.win?money(pl.win)+' / ':'')+money(pl.place)+'</span></span>';
  }).join('');
}
function dirtyCount(){
  if(!S.me) return 0;
  return Object.keys(UI.draft).filter(function(k){ return String(UI.draft[k]) !== String((D.tip[S.me.id]||{})[k]||''); }).length;
}
function renderSaveBar(){
  var old=document.getElementById('savebar'); if(old) old.remove();
  if(!S.me || UI.tab!=='tips') return;
  var races=D.byDay[UI.dayId]||[]; if(!races.length) return;
  if(races.every(isLocked) && !dirtyCount() && !SAVE.busy && !SAVE.failed) return;
  var n=dirtyCount(), picked=races.filter(function(r){return curPick(r);}).length;
  var st = SAVE.failed ? '<span class="sv bad">Not saved. Check your connection.</span>' : (SAVE.busy||n) ? '<span class="sv">Saving…</span>' : '<span class="sv ok">'+ico('check')+'Saved</span>';
  var b=document.createElement('div'); b.className='savebar'; b.id='savebar';
  b.innerHTML='<div class="in"><span><b>'+picked+' of '+races.length+'</b> tipped</span><span class="sp"></span>'+st+
    (SAVE.failed?'<button class="btn small" data-act="saveTips">Retry</button>':'')+'</div>';
  document.body.appendChild(b);
}
var SAVE={busy:false,failed:false,timer:null};
function scheduleSave(){ SAVE.failed=false; clearTimeout(SAVE.timer); SAVE.timer=setTimeout(doSave,800); renderSaveBar(); }
function doSave(){
  if(SAVE.busy){ SAVE.timer=setTimeout(doSave,400); return; }
  var sent={}; Object.keys(UI.draft).forEach(function(k){ if(String(UI.draft[k])!==String((D.tip[S.me.id]||{})[k]||'')) sent[k]=UI.draft[k]; });
  var keys=Object.keys(sent); if(!keys.length){ UI.draft={}; renderSaveBar(); return; }
  SAVE.busy=true; renderSaveBar();
  api('api_saveTips',TOKEN,keys.map(function(k){return {raceId:k,horseNo:sent[k]};}),ADMIN).then(function(st){
    SAVE.busy=false; SAVE.failed=false;
    keys.forEach(function(k){ if(UI.draft[k]===sent[k]) delete UI.draft[k]; });
    load(st);
    if(st.saveErrors && st.saveErrors.length){ keys.forEach(function(k){ delete UI.draft[k]; }); load(st); toast('Not saved: '+st.saveErrors.join('; ')); }
    if(dirtyCount()) scheduleSave();
  }).catch(function(e){ SAVE.busy=false; SAVE.failed=true; renderSaveBar(); fail(e); });
}
window.addEventListener('beforeunload',function(e){ if(S && S.me && (dirtyCount()||SAVE.busy)){ e.preventDefault(); e.returnValue=''; } });

/* ============ Leaderboard ============ */

  if(!S.days.length) return noDays();
  var out='<div class="seg"><button data-lb="carnival" class="'+(UI.lbMode==='carnival'?'on':'')+'">Carnival</button><button data-lb="day" class="'+(UI.lbMode==='day'?'on':'')+'">By day</button></div>';

    out+=dayChips();
    var races=D.byDay[UI.dayId]||[];
    var rows=ranked(S.players.map(function(p){
      var hits=races.filter(function(r){return (points(p.id,r.id)||0)>0;}).length;

    }),'t');
    var done=races.filter(function(r){return hasResult(r.id);}).length;

    out+='<div class="tbl-wrap"><table><thead><tr><th></th><th>Player</th><th class="num">Collects</th><th class="num">Total</th></tr></thead><tbody>'+
      rows.map(function(x){ return '<tr class="click '+(S.me&&x.id===S.me.id?'me':'')+'" data-cmp="'+esc(x.id)+'"><td>'+rankBadge(x.rank,x.t)+'</td><td>'+esc(x.name)+'</td><td class="num">'+x.hits+'</td><td class="num"><b>'+money(x.t)+'</b></td></tr>'; }).join('')+
      '</tbody></table></div>';

      return {label:d.name.replace(/\s*\(demo\)/,'').replace(/ Day$/,'').split(' ')[0], full:d.name, value:best?best.t:0, who:best?best.p.name:'', dot:S.me?dayTotal(S.me.id,d.id):null};
    });
    out+='<div class="card ccard"><h3>Winning score each day</h3><div class="muted csub">The day winner\'s total'+(S.me?', with your score as a dot':'')+'.</div>'+
      (S.me?legend([{name:'Day winner',color:SERIES[0]},{name:'You',color:'#17201B',dot:true}]):'')+
      colChart({items:items,dotColor:'#17201B',tip:function(it){ return '<b>'+esc(it.full)+'</b><div>Winner: '+esc(it.who)+'<span>'+money(it.value)+'</span></div>'+(it.dot!=null?'<div>You<span>'+money(it.dot)+'</span></div>':''); }})+
      tableView(['Day','Winner','Winning score'].concat(S.me?['You']:[]),items.map(function(it){ return [it.full,it.who,money(it.value)].concat(S.me?[money(it.dot)]:[]); }))+'</div>';
  } else {
    var nT=function(r){ return S.players.filter(function(p){ return (D.tip[p.id]||{})[r.id]; }).length; };
    var items2=races.map(function(r){ var n=nT(r), hit=S.players.filter(function(p){ return (points(p.id,r.id)||0)>0; }).length;
      var w=D.res[r.id].placings.filter(function(x){return x.pos===1;})[0];
      return {label:'R'+r.raceNo, full:'R'+r.raceNo+' · '+r.name, value:n?Math.round(hit/n*100):0, hit:hit, n:n, w:w?('#'+w.no+' '+horseName(r,w.no)+' '+money(w.win)):''}; });
    var pct=function(v){ return Math.round(v)+'%'; };
    out+='<div class="card ccard"><h3>Easy or tough?</h3><div class="muted csub">Share of tipsters who collected in each race. Low bars mean a roughie won.</div>'+
      colChart({items:items2,fixedMax:100,fmt:pct,tip:function(it){ return '<b>'+esc(it.full)+'</b><div>Collected<span>'+it.hit+' of '+it.n+'</span></div><div>Winner<span>'+esc(it.w)+'</span></div>'; }})+
      tableView(['Race','Collected','Winner'],items2.map(function(it){ return [it.full,it.hit+' of '+it.n+' ('+it.value+'%)',it.w]; }))+'</div>';
  }
  out+=scatterCard(rows)+'</div>'; HALF=false;

function scatterCard(rows){
  var top=rows.slice().sort(function(a,b){return b.total-a.total;}).slice(0,3).map(function(x){return x.id;});
  var pts=rows.filter(function(x){return x.tips>0;}).map(function(x){ var me=S.me&&x.id===S.me.id;
    return {name:x.name,x:x.strike,y:x.avg,total:x.total,hits:x.hits,tips:x.tips,color:me?SERIES[0]:null,label:me?'You':(top.indexOf(x.id)>=0?x.name.split(' ')[0]:'')}; });
  if(!pts.length) return '';
  return '<div class="card ccard"><h3>Safe or roughie?</h3><div class="muted csub">Right means you collect often. Up means your collects pay well. Top-right is the sweet spot.</div>'+
    (S.me?legend([{name:'You',color:SERIES[0],dot:true},{name:'Everyone else',color:'#B5BCB6',dot:true}]):'')+
    scatter({pts:pts,tip:function(p){ return '<b>'+esc(p.name)+'</b><div>Strike rate<span>'+Math.round(p.x)+'% ('+p.hits+'/'+p.tips+')</span></div><div>Avg collect<span>'+money(p.y)+'</span></div><div>Total<span>'+money(p.total)+'</span></div>'; }})+
    tableView(['Player','Strike %','Avg collect'],pts.map(function(p){ return [p.name,Math.round(p.x)+'%',money(p.y)]; }))+'</div>';
}

function vStats(){
  if(!S.days.length) return noDays();
  var out='<div class="seg"><button data-sm="carnival" class="'+(UI.statMode==='carnival'?'on':'')+'">Carnival</button><button data-sm="day" class="'+(UI.statMode==='day'?'on':'')+'">By day</button></div>';
  var races;
  if(UI.statMode==='day'){ out+=dayChips(); races=(D.byDay[UI.dayId]||[]); }
  else races=S.races.slice();
  races=races.filter(function(r){return hasResult(r.id);});
  if(!races.length) return out+'<div class="empty">Stats appear once results are in.</div>';
  var collects=[];
  var rows=S.players.map(function(p){
    var o={id:p.id,name:p.name,tips:0,wins:0,hits:0,total:0,best:0};
    races.forEach(function(r){
      var h=(D.tip[p.id]||{})[r.id]; if(!h) return;
      o.tips++;
      var pt=points(p.id,r.id)||0, pl=placingOf(r.id,effHorse(r.id,h));
      if(pl && pl.pos===1) o.wins++;
      if(pt>0){ o.hits++; o.total+=pt; o.best=Math.max(o.best,pt);
        collects.push({name:p.name,race:r,h:effHorse(r.id,h),pt:pt}); }
    });
    o.strike=o.tips?o.hits/o.tips*100:0;
    o.avg=o.hits?o.total/o.hits:0;
    return o;
  });
  out+=statCharts(races,rows);
  var k=UI.statSort;
  rows.sort(function(a,b){ return k==='name' ? a.name.localeCompare(b.name) : (b[k]-a[k]); });
  var cols=[['name','Player'],['total','Total'],['hits','Collects'],['wins','Winners'],['strike','Strike %'],['avg','Avg collect'],['best','Best']];
  out+='<div class="muted note">'+races.length+' races with results. Tap a heading to sort.</div>';
  out+='<div class="tbl-wrap"><table><thead><tr>'+cols.map(function(c){return '<th class="sort '+(c[0]!=='name'?'num':'')+(k===c[0]?' cur':'')+'" data-sort="'+c[0]+'">'+c[1]+(k===c[0]?' ↓':'')+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(x){ return '<tr class="'+(S.me&&x.id===S.me.id?'me':'')+'"><td>'+esc(x.name)+'</td><td class="num"><b>'+money(x.total)+'</b></td><td class="num">'+x.hits+'/'+x.tips+'</td><td class="num">'+x.wins+'</td><td class="num">'+x.strike.toFixed(0)+'%</td><td class="num">'+money(x.avg)+'</td><td class="num">'+money(x.best)+'</td></tr>'; }).join('')+
    '</tbody></table></div>';

  collects.sort(function(a,b){return b.pt-a.pt;});
  out+='<h2>Biggest collects</h2><div class="tbl-wrap"><table><tbody>'+collects.slice(0,8).map(function(c){
    return '<tr><td>'+esc(c.name)+'</td><td>'+esc(D.day[c.race.dayId]?D.day[c.race.dayId].name:'')+' R'+c.race.raceNo+'</td><td>'+esc(c.h)+'. '+esc(horseName(c.race,c.h))+'</td><td class="num pts">'+money(c.pt)+'</td></tr>'; }).join('')+'</tbody></table></div>';

  // Missed roughies: best-paying winners nobody (or few) tipped
  var miss=races.map(function(r){ var w=D.res[r.id].placings.find(function(p){return p.pos===1;}); if(!w) return null;
    var n=S.players.filter(function(p){return effHorse(r.id,(D.tip[p.id]||{})[r.id])===String(w.no);}).length;
    return {r:r,w:w,n:n}; }).filter(Boolean).sort(function(a,b){return b.w.win-a.w.win;}).slice(0,5);
  out+='<h2>Best-paying winners</h2><div class="tbl-wrap"><table><tbody>'+miss.map(function(m){
    return '<tr><td>'+esc(D.day[m.r.dayId]?D.day[m.r.dayId].name:'')+' R'+m.r.raceNo+'</td><td>'+esc(m.w.no)+'. '+esc(horseName(m.r,m.w.no))+'</td><td class="num">'+money(m.w.win)+'</td><td class="num muted">'+m.n+' tipped</td></tr>'; }).join('')+'</tbody></table></div>';
  return out;
}

function showModal(title,text){
  var m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="card"><div class="row"><h3>'+esc(title)+'</h3><span class="sp"></span><button class="btn ghost small" data-close>Close</button></div>'+
    '<textarea readonly style="min-height:220px;margin-top:8px">'+esc(text)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-copy>Copy</button></div></div>';
  document.body.appendChild(m);
  var ta=m.querySelector('textarea'); ta.focus(); ta.select();
  m.addEventListener('click',function(e){
    if(e.target===m || e.target.hasAttribute('data-close')) m.remove();
    if(e.target.hasAttribute('data-copy')){ ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(x){}
      if(!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(function(){toast('Copied');},function(){toast('Select the text and copy it');}); else toast(ok?'Copied':'Select the text and copy it'); }
  });
}

document.addEventListener('click',function(e){

  if(d.tipr){ UI.tipRace[UI.dayId]=d.tipr; render(); var rb=document.querySelector('.rbtns'); if(rb) rb.scrollIntoView({block:'start',behavior:'smooth'}); return; }
  if(d.tab){ UI.tab=d.tab; render(); window.scrollTo(0,0); return; }

  if(d.lb){ UI.lbMode=d.lb; render(); return; }

  if(d.pin){ var pp=getPins(), k=pp.indexOf(d.pin); if(k>=0) pp.splice(k,1); else pp.push(d.pin); setPins(pp); render(); return; }
  if(d.gsort){ UI.gridSort=d.gsort; render(); return; }

    if(i>=0) UI.compare.splice(i,1); else { if(UI.compare.length>=6){ toast('Up to 6 players'); return; } UI.compare.push(d.pick); }
    render(); return; }
  if(d.link){ var p=D.player[d.link]; showModal(p.name+' — personal link', linkFor(p)); return; }
  if(d.reset){ if(!confirm('Give '+D.player[d.reset].name+' a new link? Their old link will stop working.')) return; admin('resetToken',{id:d.reset}); return; }
  if(d.remove){ if(!confirm('Remove '+D.player[d.remove].name+' and all their tips?')) return; admin('removePlayer',{id:d.remove}); return; }

    var p={id:UI.adminDay||'',name:val('dName').trim(),date:val('dDate'),order:val('dOrder'),paste:val('dPaste'),lockAt:lk?new Date(lk).toISOString():'',tab:val('dTab').trim()};
    if(!p.name||!p.date){ toast('Name and date needed'); return; }
    admin('saveDay',p,function(st){ if(!UI.adminDay){ var nd=st.days.find(function(d){return d.name===p.name&&d.date===p.date;}); if(nd) UI.adminDay=nd.id; } UI.dayId=UI.adminDay||UI.dayId; });
  },
  tabImport:function(){ if(!UI.adminDay){ toast('Save the day first'); return; }
    var n=(D.byDay[UI.adminDay]||[]).length;
    if(n && !confirm('Replace the fields for this day with the ones on TABtouch? Tips on horse numbers that are still in the field are kept.')) return;
    var id=UI.adminDay; admin('tabImport',{dayId:id},function(){ UI.dayId=id; UI.adminRace=null; },'Importing from TABtouch… this can take 20 seconds'); },
  deleteDay:function(){ if(!confirm('Delete this day, its races, tips and results?')) return; var id=UI.adminDay; UI.adminDay=''; admin('deleteDay',{id:id}); },
  addPlayers:function(){ var tx=val('pAdd'); if(!tx.trim()) return; admin('addPlayers',{text:tx}); },
  allLinks:function(){ showModal('Player links', S.players.map(function(p){return p.name+(p.email?' <'+p.email+'>':'')+'\n'+linkFor(p);}).join('\n\n')); },
  saveCfg:function(){ admin('setConfig',{TITLE:val('cTitle'),RESULTS_URL:val('cUrl').trim(),TAB_MEETING:val('cMeet').trim()||'mr'}); },
  fetchNow:function(){ admin('fetchNow',{},null,'Checking TABtouch…'); },
  tabTest:function(){ if(!UI.adminRace){ toast('Pick a race in the Results section first'); return; } admin('tabTest',{raceId:UI.adminRace},null,'Testing…'); },
  autoOn:function(){ admin('installTrigger',{},null,'Turning on…'); },
  daySource:function(){ if(!UI.adminDay){ toast('Save the day first'); return; }
    var n=prompt('Which race number?','1'); if(n===null) return; n=parseInt(n,10)||1;
    admin('tabSource',{dayId:UI.adminDay,raceNo:n},null,'Fetching page…'); },
  tabSource:function(){ if(!UI.adminRace){ toast('Pick a race in the Results section first'); return; } admin('tabSource',{raceId:UI.adminRace},null,'Fetching page…'); },
  loadDemo:function(){ admin('loadDemo',{},function(){ UI.dayId=null; UI.adminRace=null; UI.compare=[]; }); },
  clearDemo:function(){ if(!confirm('Remove all demo players, days, tips and results?')) return; admin('clearDemo',{},function(){ UI.dayId=null; UI.adminRace=null; UI.compare=[]; }); },
  addRow:function(){ UI.extraRows=UI.extraRows||{}; UI.extraRows[UI.adminRace]=(UI.extraRows[UI.adminRace]||0)+1; render(); },
  saveResult:function(){
    var f=document.getElementById('resForm');
    var placings=[].map.call(f.querySelectorAll('.plc'),function(row){
      var no=row.querySelector('.pNo'); if(!no) return null;
      return {pos:row.querySelector('.pPos').value,no:no.value,win:row.querySelector('.pWin').value,place:row.querySelector('.pPlace').value};
    }).filter(function(x){return x && x.no;});
    var scr=[].map.call(f.querySelectorAll('.scrck:checked'),function(c){return c.value;});
    var fav=val('rFav');
    if(scr.length && !fav && placings.length){ if(!confirm('Scratchings are marked but no favourite is set — tips on scratched horses will score $0. Save anyway?')) return; }
    if(UI.extraRows) delete UI.extraRows[f.dataset.race];
    admin('saveResult',{raceId:f.dataset.race,placings:placings,scratched:scr,favourite:fav,status:document.getElementById('rInterim').checked?'interim':'final'});
  },
  clearResult:function(){ if(!confirm('Clear this result and scratchings?')) return; admin('clearResult',{raceId:UI.adminRace}); }
};
function toLocalInput(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; var p=function(n){return ('0'+n).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function admin(action,payload,after,busyMsg){
  toast(busyMsg||'Saving…');
  api('api_admin',ADMIN,action,payload,TOKEN).then(function(st){ if(after) after(st); load(st);
    if(st.source) saveSource(st.source); else if(st.diag) showDiag(st.diag); else toast(st.fetchMsg || 'Saved'); }).catch(fail);
}
function saveSource(s){
  try{ var blob=new Blob([s.html],{type:'text/html'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=s.name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast(s.status===200 ? 'Saved '+s.name : 'TABtouch returned '+s.status+'. File saved anyway.'); }
  catch(e){ showModal('Page source ('+s.status+')', s.html); }
}
function favNeeded(){   // races with a result, no favourite, and at least one tip on a scratched horse
  return S.races.filter(function(r){ var x=D.res[r.id]; if(!x || !hasResult(r.id) || x.favourite) return false;
    var scr=(x.scratched||[]).map(String); if(!scr.length) return false;
    return S.players.some(function(p){ var t=(D.tip[p.id]||{})[r.id]; return t && scr.indexOf(String(t))>=0; }); });
}
function showDiag(d){
  var ok = d.status===200 && d.parsed && d.parsed.placings && d.parsed.placings.length;
  var lines=[];
  lines.push(ok ? 'RESULT READ OK' : (d.error ? 'COULD NOT CONNECT' : d.status!==200 ? 'TABTOUCH RETURNED AN ERROR' : d.hasResultBlock ? 'PAGE FOUND, BUT NO RESULT ON IT YET' : 'PAGE FOUND, BUT NOT IN THE EXPECTED LAYOUT'));
  lines.push('');
  lines.push('Race page: '+d.url+'   (meeting code '+(d.meeting||'')+')');
  lines.push('Status: '+(d.error||d.status)+'   Size: '+(d.length||0)+' characters');
  lines.push('Result block found: '+(d.hasResultBlock?'yes':'no')+'   Placings found: '+(d.positionMarkers||0)+'   Runner numbers: '+(d.runnerNumbers||0)+(d.needsJavaScript?'   (page says it needs JavaScript)':''));
  if(d.parsed){ lines.push(''); lines.push('What would be saved:');
    d.parsed.placings.forEach(function(p){ lines.push('  '+ordinal(p.pos)+'  #'+p.no+'  win $'+p.win+'  place $'+p.place); });
    lines.push('  Favourite: '+(d.parsed.favourite?'#'+d.parsed.favourite+' (won)':'not shown on the page (TABtouch only marks it when it wins)'));
    lines.push('  Dividends official: '+(d.parsed.official?'yes':'not yet')); }
  lines.push('');
  lines.push('Runner list on the page: '+(d.starters||0)+' runners');
  if(d.starters){
    lines.push('  Favourite by lowest tote win dividend: '+(d.favByDividend?'#'+d.favByDividend:'none yet'));
    lines.push('  Scratched according to the list: '+((d.scratchedByStarters||[]).join(', ')||'none flagged'));
    if(d.field) lines.push('  Import would read: '+d.field.name+' | start '+(d.field.start||'not found')+' | first runner '+JSON.stringify(d.field.first));
    lines.push('  Field names: '+(d.starterKeys||[]).join(', '));
    lines.push('  First runner as sent: '+(d.starterSample||''));
  }
  lines.push(''); lines.push('Scratchings page: '+d.scratchUrl);
  lines.push('Status: '+(d.scratchError||d.scratchStatus)+'   Size: '+(d.scratchLength||0));
  lines.push('Scratchings read: '+(d.scratchParsed?JSON.stringify(d.scratchParsed):'meeting not found on the page'));
  lines.push(''); lines.push('----- copy everything below and send it to Claude if something is wrong -----');
  lines.push('BEFORE THE RUNNER LIST:'); lines.push(d.aroundList||'(runner list not found)'); lines.push('');
  lines.push('AFTER THE RUNNER LIST:'); lines.push(d.afterList||''); lines.push('');
  lines.push('RACE PAGE SAMPLE:'); lines.push(d.sample||''); lines.push(''); lines.push('SCRATCHINGS SAMPLE:'); lines.push(d.scratchSample||'');
  showModal('TAB connection test', lines.join('\n'));
}

/* ============ Boot ============ */
function busy(){ var a=document.activeElement; return !!document.querySelector('.modal') || SAVE.busy || (S && dirtyCount()>0) || (a && /SELECT|INPUT|TEXTAREA/.test(a.tagName)); }
function load(st){
  S=st; derive();
  var old=!(st.version>=2);
  var w=document.getElementById('oldwarn');
  if(old && !w){ w=document.createElement('div'); w.id='oldwarn'; w.className='oldwarn';
    w.innerHTML='<b>The Google script is out of date.</b> In Apps Script: paste in the latest Code.gs, then Deploy → Manage deployments → pencil icon → Version: <b>New version</b> → Deploy. Until then, tips stay hidden until each race starts.';
    var m=document.querySelector('main'); m.parentNode.insertBefore(w,m); }
  if(!old && w) w.remove();
  if(!UI.dayId || !D.day[UI.dayId]) UI.dayId=defaultDay();
  render();
}
function refresh(){ return api('api_getState',TOKEN,ADMIN).then(load).catch(fail); }

getParams().then(function(p){
  P=p;
  TOKEN = p.t || store('tip_token') || '';
  ADMIN = p.admin || '';
  if(p.t) store('tip_token',p.t);
  return refresh();
}).then(function(){
  if(S && !S.me && TOKEN && !S.isAdmin) toast('That link isn\'t recognised — ask the organiser for yours.');
  setInterval(function(){ if(document.visibilityState==='visible' && !busy() && UI.tab!=='admin') refresh(); }, 60000);
  setInterval(function(){ if((UI.tab==='tips'||UI.tab==='mine') && !busy()) render(); }, 30000);
});
</script>
</body>
